train_file = "TinyStories-train.txt"
validation_file = "TinyStories-valid.txt"
smoke_command = "$MICROLLM_ENGINE_DIR/scripts/fetch_tinystories_smoke.sh"
split_method = "official train/validation files; no adjacent-window random split"
tokenizer = "byte reference or trained microLLM BPE"
notes = "A 1MiB immutable train prefix completed a 10-step Model-S HIP smoke; no reference training run yet."
