<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="570" viewBox="0 0 1040 570" role="img" aria-labelledby="title desc">
  <title id="title">FP8 activation scale error turn</title><desc id="desc">DeepSeek top-equal RMS turns upward while Qwen continues downward at activation scale 0.8.</desc>
