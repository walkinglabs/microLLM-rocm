  <text x="470" y="525" fill="#cbd5e1" font-family="sans-serif" font-size="14" text-anchor="middle">Q T1024</text>
  <rect x="575" y="435" width="90" height="50" rx="7" fill="#fb7185"/>
  <text x="620" y="420" fill="#fecdd3" font-family="monospace" font-size="14" text-anchor="middle">1.0063×</text>
