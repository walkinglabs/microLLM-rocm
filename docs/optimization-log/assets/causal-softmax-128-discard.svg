  <text x="320" y="266" fill="#a7f3d0" font-family="monospace" font-size="14" text-anchor="middle">1.0255×</text>
  <text x="320" y="525" fill="#cbd5e1" font-family="sans-serif" font-size="14" text-anchor="middle">Q T512</text>
