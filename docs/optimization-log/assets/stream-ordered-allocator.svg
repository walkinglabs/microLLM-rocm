    <text x="192" y="462" fill="#cbd5e1">N8</text>
    <rect x="325" y="223" width="54" height="207" rx="5" fill="#38bdf8"/><text x="352" y="211" fill="#7dd3fc">0.648×</text>
    <rect x="385" y="417" width="54" height="13" rx="4" fill="#fb7185"/><text x="412" y="405" fill="#fda4af">0.040×</text>
    <text x="382" y="462" fill="#cbd5e1">N32</text>
    <rect x="515" y="232" width="54" height="198" rx="5" fill="#38bdf8"/><text x="542" y="220" fill="#7dd3fc">0.619×</text>
    <rect x="575" y="418" width="54" height="12" rx="4" fill="#fb7185"/><text x="602" y="406" fill="#fda4af">0.036×</text>
    <text x="572" y="462" fill="#cbd5e1">N128</text>
    <rect x="705" y="206" width="54" height="224" rx="5" fill="#38bdf8"/><text x="732" y="194" fill="#7dd3fc">0.700×</text>
