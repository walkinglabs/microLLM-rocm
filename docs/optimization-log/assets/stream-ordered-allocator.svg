<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc">
  <title id="title">HIP Stream ordered allocator policies versus deferred lifetime</title>
  <desc id="desc">Eager async reaches about 0.62 to 0.70 of deferred speed while Graph allocation nodes reach about 0.04.</desc>
  <rect width="960" height="560" fill="#0b1020"/>
  <text x="48" y="48" fill="#f8fafc" font-family="sans-serif" font-size="25" font-weight="700">Address reuse succeeds; execution policy fails</text>
  <text x="48" y="76" fill="#94a3b8" font-family="sans-serif" font-size="14">MI300X · 4096 elements · median of 3 fresh processes · candidate / deferred</text>
  <line x1="90" y1="430" x2="900" y2="430" stroke="#475569"/>
  <line x1="90" y1="110" x2="900" y2="110" stroke="#22c55e" stroke-dasharray="7 7"/>
  <text x="905" y="115" fill="#86efac" font-family="sans-serif" font-size="12">1.0×</text>
  <g font-family="sans-serif" font-size="13" text-anchor="middle">
    <rect x="135" y="216" width="54" height="214" rx="5" fill="#38bdf8"/><text x="162" y="204" fill="#7dd3fc">0.668×</text>
