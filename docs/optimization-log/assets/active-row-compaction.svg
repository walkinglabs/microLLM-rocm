<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img" aria-labelledby="title desc">
  <title id="title">Active-row compaction removes dummy model work</title>
  <desc id="desc">Only real survivor rows enter cached forward. Five Release shapes improve and alternating pairs confirm the gain.</desc>
  <rect width="1080" height="620" fill="#0b1020"/>
  <text x="40" y="44" fill="#f8fafc" font-family="sans-serif" font-size="24" font-weight="700">Experiment 097 · empty slots stop running the model</text>
  <text x="40" y="72" fill="#94a3b8" font-family="sans-serif" font-size="14">Active-row gather → shared Storage B1 views → compact logits scatter</text>

  <rect x="40" y="108" width="470" height="210" rx="12" fill="#111827" stroke="#334155"/>
  <text x="64" y="144" fill="#fecaca" font-family="sans-serif" font-size="17" font-weight="700">Before · fixed B=4</text>
  <rect x="70" y="176" width="88" height="48" rx="6" fill="#1f2937" stroke="#64748b"/><text x="114" y="205" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">dummy</text>
  <rect x="168" y="176" width="88" height="48" rx="6" fill="#14532d" stroke="#22c55e"/><text x="212" y="205" text-anchor="middle" fill="#dcfce7" font-family="sans-serif" font-size="13">row 1</text>
  <rect x="266" y="176" width="88" height="48" rx="6" fill="#1f2937" stroke="#64748b"/><text x="310" y="205" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">dummy</text>
  <rect x="364" y="176" width="88" height="48" rx="6" fill="#172554" stroke="#3b82f6"/><text x="408" y="205" text-anchor="middle" fill="#dbeafe" font-family="sans-serif" font-size="13">row 3</text>
  <text x="64" y="270" fill="#fca5a5" font-family="sans-serif" font-size="13">4 model rows + clear two full KV rows</text>

  <rect x="570" y="108" width="470" height="210" rx="12" fill="#111827" stroke="#334155"/>
  <text x="594" y="144" fill="#bbf7d0" font-family="sans-serif" font-size="17" font-weight="700">After · active A=2</text>
  <rect x="652" y="176" width="120" height="48" rx="6" fill="#14532d" stroke="#22c55e"/><text x="712" y="205" text-anchor="middle" fill="#dcfce7" font-family="sans-serif" font-size="13">row 1 · pos p1</text>
  <rect x="790" y="176" width="120" height="48" rx="6" fill="#172554" stroke="#3b82f6"/><text x="850" y="205" text-anchor="middle" fill="#dbeafe" font-family="sans-serif" font-size="13">row 3 · pos p3</text>
  <text x="594" y="270" fill="#86efac" font-family="sans-serif" font-size="13">2 model rows · inactive capacity untouched</text>

  <rect x="40" y="348" width="1000" height="220" rx="12" fill="#111827" stroke="#334155"/>
  <text x="64" y="382" fill="#e2e8f0" font-family="sans-serif" font-size="17" font-weight="700">Release candidate / Experiment 096 throughput</text>
  <line x1="92" y1="518" x2="1008" y2="518" stroke="#64748b"/>
  <line x1="92" y1="482" x2="1008" y2="482" stroke="#f59e0b" stroke-dasharray="8 8"/>
  <text x="50" y="487" fill="#fbbf24" font-family="sans-serif" font-size="13">1×</text>
  <rect x="145" y="451" width="92" height="67" fill="#22c55e"/><text x="191" y="442" text-anchor="middle" fill="#bbf7d0" font-family="sans-serif" font-size="13">1.134×</text>
  <rect x="311" y="439" width="92" height="79" fill="#22c55e"/><text x="357" y="430" text-anchor="middle" fill="#bbf7d0" font-family="sans-serif" font-size="13">1.222×</text>
  <rect x="477" y="424" width="92" height="94" fill="#22c55e"/><text x="523" y="415" text-anchor="middle" fill="#bbf7d0" font-family="sans-serif" font-size="13">1.305×</text>
  <rect x="643" y="414" width="92" height="104" fill="#22c55e"/><text x="689" y="405" text-anchor="middle" fill="#bbf7d0" font-family="sans-serif" font-size="13">1.348×</text>
  <rect x="809" y="436" width="92" height="82" fill="#22c55e"/><text x="855" y="427" text-anchor="middle" fill="#bbf7d0" font-family="sans-serif" font-size="13">1.239×</text>
  <text x="191" y="544" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12">R2/S2</text><text x="357" y="544" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12">R4/S2</text><text x="523" y="544" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12">R8/S2</text><text x="689" y="544" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12">R4/S4</text><text x="855" y="544" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12">R8/S4</text>
  <text x="64" y="594" fill="#94a3b8" font-family="sans-serif" font-size="13">Alternating A/B: R4/S4 1.292× · R8/S2 1.226× · reference drift below 0.8% · exact outputs</text>
</svg>
