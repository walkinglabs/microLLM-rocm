  <text x="385" y="278" fill="#fecdd3" font-family="monospace" font-size="14">0.973×</text>

  <text x="55" y="338" fill="#e2e8f0" font-family="sans-serif" font-size="17" font-weight="700">DeepSeek</text>
  <text x="125" y="378" fill="#cbd5e1" font-family="sans-serif" font-size="15">operator</text>
