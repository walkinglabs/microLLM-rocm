  <rect x="55" y="680" width="1390" height="55" rx="18" fill="#ecfdf5" stroke="#16a34a" stroke-width="2"/>
  <text x="750" y="715" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="19" font-weight="700" fill="#166534">Extend explicit fixed-prompt evidence to T2048 · default off · next scale changes prompt content</text>
