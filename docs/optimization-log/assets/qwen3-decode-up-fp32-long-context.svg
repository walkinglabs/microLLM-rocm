<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="760" viewBox="0 0 1500 760">
  <rect width="1500" height="760" fill="#f7f8fc"/>
  <text x="60" y="62" font-family="Inter,Arial,sans-serif" font-size="34" font-weight="700" fill="#172033">Qwen3 phase policy · T1024 / T2048</text>
  <text x="60" y="99" font-family="Inter,Arial,sans-serif" font-size="18" fill="#5b6474">32 workers · row-level batch evidence · common FP32 first-split oracles</text>

  <rect x="55" y="135" width="420" height="260" rx="20" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <text x="265" y="183" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#1d4ed8">Long shape matrix</text>
  <text x="265" y="245" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="46" font-weight="700" fill="#166534">32 / 32</text>
