<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="600" viewBox="0 0 1040 600" role="img" aria-labelledby="title desc">
  <title id="title">Static slot ratio sweep flips with traffic distribution</title>
  <desc id="desc">Normalized throughput, cache and TTFT P95 for two-six, four-four and six-two bucket slot ratios under short-heavy and long-heavy traffic.</desc>
  <rect width="1040" height="600" rx="18" fill="#0b1020"/>
  <text x="52" y="52" fill="#f8fafc" font-size="28" font-family="sans-serif" font-weight="700">静态 slot 比例随流量翻转</text>
  <text x="52" y="82" fill="#94a3b8" font-size="16" font-family="sans-serif">比例均相对 Uniform；两模型趋势一致</text>
  <g font-family="sans-serif" font-size="21" fill="#e2e8f0"><text x="110" y="126">short-heavy</text><text x="585" y="126">long-heavy</text></g>
  <g stroke="#334155"><line x1="80" y1="170" x2="480" y2="170"/><line x1="555" y1="170" x2="955" y2="170"/></g>
  <g font-family="sans-serif" font-size="16" fill="#cbd5e1">
    <text x="100" y="520">2:6</text><text x="255" y="520">4:4</text><text x="410" y="520">6:2</text>
    <text x="575" y="520">2:6</text><text x="730" y="520">4:4</text><text x="885" y="520">6:2</text>
  </g>
  <g>
    <rect x="92" y="390" width="28" height="110" fill="#38bdf8"/><rect x="124" y="362" width="28" height="138" fill="#22c55e"/><rect x="156" y="95" width="28" height="405" fill="#fb7185"/>
    <rect x="247" y="375" width="28" height="125" fill="#38bdf8"/><rect x="279" y="394" width="28" height="106" fill="#22c55e"/><rect x="311" y="240" width="28" height="260" fill="#fb7185"/>
    <rect x="402" y="355" width="28" height="145" fill="#38bdf8"/><rect x="434" y="425" width="28" height="75" fill="#22c55e"/><rect x="466" y="430" width="28" height="70" fill="#fb7185"/>
    <rect x="567" y="350" width="28" height="150" fill="#38bdf8"/><rect x="599" y="362" width="28" height="138" fill="#22c55e"/><rect x="631" y="320" width="28" height="180" fill="#fb7185"/>
    <rect x="722" y="402" width="28" height="98" fill="#38bdf8"/><rect x="754" y="394" width="28" height="106" fill="#22c55e"/><rect x="786" y="245" width="28" height="255" fill="#fb7185"/>
    <rect x="877" y="422" width="28" height="78" fill="#38bdf8"/><rect x="909" y="425" width="28" height="75" fill="#22c55e"/><rect x="941" y="145" width="28" height="355" fill="#fb7185"/>
  </g>
  <line x1="72" y1="330" x2="980" y2="330" stroke="#f8fafc" stroke-opacity="0.45" stroke-dasharray="6 6"/>
  <text x="78" y="322" fill="#cbd5e1" font-size="14" font-family="sans-serif">Uniform 100%</text>
  <g font-family="sans-serif" font-size="15" fill="#cbd5e1">
    <rect x="190" y="558" width="16" height="16" rx="3" fill="#38bdf8"/><text x="216" y="572">throughput</text>
    <rect x="390" y="558" width="16" height="16" rx="3" fill="#22c55e"/><text x="416" y="572">KV backing</text>
    <rect x="590" y="558" width="16" height="16" rx="3" fill="#fb7185"/><text x="616" y="572">focus TTFT P95（越低越好）</text>
  </g>
</svg>
