<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820">
  <rect width="1400" height="820" fill="#f8fafc"/>
  <text x="700" y="52" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#111827">Experiment 081 · in-place causal softmax</text>
  <text x="700" y="82" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#64748b">Reuse dead QK scores · bit-identical logits · T2048 B8 paired evidence</text>

  <rect x="38" y="110" width="1324" height="184" rx="14" fill="#fff" stroke="#dbe4ee"/>
  <text x="62" y="148" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#111827">Tensor lifetime</text>
  <text x="62" y="196" font-family="Inter,Arial,sans-serif" font-size="15" fill="#475569">Before</text>
  <rect x="150" y="174" width="250" height="44" rx="8" fill="#fca5a5"/><text x="275" y="202" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#7f1d1d">scores [B,H,T,T]</text>
  <text x="418" y="202" font-family="Inter,Arial,sans-serif" font-size="22" fill="#64748b">+</text>
  <rect x="458" y="174" width="250" height="44" rx="8" fill="#fdba74"/><text x="583" y="202" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#7c2d12">probabilities [B,H,T,T]</text>
  <text x="62" y="258" font-family="Inter,Arial,sans-serif" font-size="15" fill="#475569">After</text>
  <rect x="150" y="236" width="558" height="44" rx="8" fill="#86efac"/><text x="429" y="264" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#14532d">scores Storage overwritten in-place by probabilities</text>
  <text x="760" y="214" font-family="Inter,Arial,sans-serif" font-size="17" font-weight="700" fill="#166534">Removed exactly one T² Tensor</text>
  <text x="760" y="252" font-family="Inter,Arial,sans-serif" font-size="14" fill="#64748b">Public out-of-place softmax remains the reference API.</text>

  <rect x="38" y="320" width="650" height="330" rx="14" fill="#fff" stroke="#dbe4ee"/>
  <text x="62" y="360" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#111827">T2048 B8 peak memory</text>
  <g font-family="Inter,Arial,sans-serif" font-size="15" fill="#334155">
    <text x="62" y="420">Qwen reference</text><rect x="220" y="401" width="360" height="24" rx="4" fill="#94a3b8"/><text x="590" y="419">5.147 GiB</text>
    <text x="62" y="464">Qwen inplace</text><rect x="220" y="445" width="238" height="24" rx="4" fill="#2563eb"/><text x="468" y="463">3.397 GiB · -34.0%</text>
    <text x="62" y="534">DeepSeek reference</text><rect x="220" y="515" width="448" height="24" rx="4" fill="#94a3b8"/><text x="565" y="533">7.997 GiB</text>
    <text x="62" y="578">DeepSeek inplace</text><rect x="220" y="559" width="364" height="24" rx="4" fill="#0f766e"/><text x="492" y="577">6.496 GiB · -18.8%</text>
  </g>
  <text x="62" y="624" font-family="Inter,Arial,sans-serif" font-size="13" fill="#64748b">Removed bytes match B×H×T²×4 exactly for both models.</text>

  <rect x="714" y="320" width="648" height="330" rx="14" fill="#fff" stroke="#dbe4ee"/>
  <text x="738" y="360" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#111827">B8 peak reduction grows with context</text>
  <g font-family="Inter,Arial,sans-serif" font-size="14" fill="#334155">
    <text x="738" y="416">Qwen T256</text><rect x="890" y="400" width="17" height="18" fill="#93c5fd"/><text x="917" y="415">2.1%</text>
    <text x="738" y="452">Qwen T512</text><rect x="890" y="436" width="58" height="18" fill="#60a5fa"/><text x="958" y="451">7.2%</text>
    <text x="738" y="488">Qwen T1024</text><rect x="890" y="472" width="153" height="18" fill="#3b82f6"/><text x="1053" y="487">19.1%</text>
    <text x="738" y="524">Qwen T2048</text><rect x="890" y="508" width="272" height="18" fill="#2563eb"/><text x="1172" y="523">34.0%</text>
    <text x="738" y="570">DeepSeek T512</text><rect x="890" y="554" width="14" height="18" fill="#5eead4"/><text x="914" y="569">1.8%</text>
    <text x="738" y="606">DeepSeek T1024</text><rect x="890" y="590" width="56" height="18" fill="#2dd4bf"/><text x="956" y="605">7.0%</text>
    <text x="738" y="642">DeepSeek T2048</text><rect x="890" y="626" width="150" height="18" fill="#0f766e"/><text x="1050" y="641">18.8%</text>
  </g>

  <rect x="38" y="676" width="1324" height="96" rx="14" fill="#dcfce7" stroke="#bbf7d0"/>
  <text x="700" y="714" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="21" font-weight="700" fill="#166534">KEEP · max-abs 0 · RMSE 0 · 16/16 top tokens equal · minimum throughput ratio 0.990×</text>
  <text x="700" y="746" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#166534">Paired T2048 B8 throughput: Qwen 1.017× · DeepSeek 1.005×</text>
  <text x="700" y="804" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" fill="#64748b">Raw evidence: docs/optimization-log/experiments/081-data</text>
</svg>
