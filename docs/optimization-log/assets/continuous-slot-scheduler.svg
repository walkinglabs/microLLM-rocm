<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="620" viewBox="0 0 1080 620" role="img" aria-labelledby="title desc">
  <title id="title">Continuous slot refill correctness with divergent and uniform performance controls</title>
  <desc id="desc">Request A leaves slot zero, request C refills it while B continues. Divergent benchmarks remain below serial while a uniform control exceeds serial but trails static batching.</desc>
  <rect width="1080" height="620" fill="#0b1020"/>
  <text x="40" y="44" fill="#f8fafc" font-family="sans-serif" font-size="24" font-weight="700">Experiment 096 · refill works, parallel speed does not yet</text>
  <text x="40" y="72" fill="#94a3b8" font-family="sans-serif" font-size="14">Correctness state machine plus MI300X negative performance gate</text>

  <rect x="40" y="106" width="1000" height="190" rx="12" fill="#111827" stroke="#334155"/>
  <text x="64" y="140" fill="#e2e8f0" font-family="sans-serif" font-size="17" font-weight="700">Two shared KV rows</text>
  <text x="66" y="182" fill="#94a3b8" font-family="sans-serif" font-size="13">step 1</text>
  <rect x="125" y="158" width="120" height="42" rx="6" fill="#14532d" stroke="#22c55e"/><text x="185" y="184" text-anchor="middle" fill="#dcfce7" font-family="sans-serif" font-size="14">A · pos 4</text>
  <rect x="255" y="158" width="120" height="42" rx="6" fill="#172554" stroke="#3b82f6"/><text x="315" y="184" text-anchor="middle" fill="#dbeafe" font-family="sans-serif" font-size="14">B · pos 4</text>
  <text x="402" y="182" fill="#94a3b8" font-family="sans-serif" font-size="13">step 2</text>
  <rect x="461" y="158" width="120" height="42" rx="6" fill="#1f2937" stroke="#64748b"/><text x="521" y="184" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="14">free · pos 0</text>
  <rect x="591" y="158" width="120" height="42" rx="6" fill="#172554" stroke="#3b82f6"/><text x="651" y="184" text-anchor="middle" fill="#dbeafe" font-family="sans-serif" font-size="14">B · pos 5</text>
  <text x="738" y="182" fill="#94a3b8" font-family="sans-serif" font-size="13">step 3</text>
  <rect x="797" y="158" width="100" height="42" rx="6" fill="#713f12" stroke="#f59e0b"/><text x="847" y="184" text-anchor="middle" fill="#fef3c7" font-family="sans-serif" font-size="14">C · pos 3</text>
  <rect x="907" y="158" width="100" height="42" rx="6" fill="#172554" stroke="#3b82f6"/><text x="957" y="184" text-anchor="middle" fill="#dbeafe" font-family="sans-serif" font-size="14">B · pos 6</text>
  <path d="M242 226 C360 275,690 275,820 226" fill="none" stroke="#f59e0b" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="530" y="269" text-anchor="middle" fill="#fbbf24" font-family="sans-serif" font-size="13">slot 0: reset A → prefill C · backing Storage stays</text>
  <text x="540" y="317" text-anchor="middle" fill="#86efac" font-family="sans-serif" font-size="13">Release uniform: 1.434×–2.356× serial · still only 0.308×–0.680× static batch</text>

  <rect x="40" y="326" width="1000" height="238" rx="12" fill="#111827" stroke="#334155"/>
  <text x="64" y="360" fill="#e2e8f0" font-family="sans-serif" font-size="17" font-weight="700">divergent continuous throughput / serial reference</text>
  <line x1="90" y1="514" x2="1006" y2="514" stroke="#64748b"/>
  <line x1="90" y1="386" x2="1006" y2="386" stroke="#f59e0b" stroke-dasharray="8 8"/>
  <text x="52" y="391" fill="#fbbf24" font-family="sans-serif" font-size="13">1×</text>
  <rect x="145" y="404" width="92" height="110" fill="#ef4444"/><text x="191" y="396" text-anchor="middle" fill="#fecaca" font-family="sans-serif" font-size="13">0.858×</text>
  <rect x="311" y="409" width="92" height="105" fill="#ef4444"/><text x="357" y="401" text-anchor="middle" fill="#fecaca" font-family="sans-serif" font-size="13">0.824×</text>
  <rect x="477" y="414" width="92" height="100" fill="#ef4444"/><text x="523" y="406" text-anchor="middle" fill="#fecaca" font-family="sans-serif" font-size="13">0.781×</text>
  <rect x="643" y="418" width="92" height="96" fill="#ef4444"/><text x="689" y="410" text-anchor="middle" fill="#fecaca" font-family="sans-serif" font-size="13">0.748×</text>
  <rect x="809" y="412" width="92" height="102" fill="#ef4444"/><text x="855" y="404" text-anchor="middle" fill="#fecaca" font-family="sans-serif" font-size="13">0.794×</text>
  <text x="191" y="540" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12">R2/S2</text><text x="357" y="540" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12">R4/S2</text><text x="523" y="540" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12">R8/S2</text><text x="689" y="540" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12">R4/S4</text><text x="855" y="540" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="12">R8/S4</text>
  <text x="64" y="590" fill="#94a3b8" font-family="sans-serif" font-size="13">5/5 exact outputs · all decode calls divergent · serial B1 oracle + dummy rows explain the loss</text>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#f59e0b"/></marker></defs>
</svg>
