<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="650" viewBox="0 0 1120 650" role="img" aria-labelledby="title desc">
  <title id="title">Release steady decode throughput ratios and batch-eight peak memory</title>
  <desc id="desc">Qwen meets or exceeds PyTorch at all measured contexts. DeepSeek is faster at context 8 and 512, but slower at context 2048. microLLM uses much less peak memory for long batch-eight cases.</desc>
  <rect width="1120" height="650" fill="#0b1020"/>
  <text x="40" y="42" fill="#f8fafc" font-family="sans-serif" font-size="24" font-weight="700">Experiment 085 · real steady decode, Release/gfx942</text>
  <text x="40" y="70" fill="#94a3b8" font-family="sans-serif" font-size="14">N8 · warm-up excluded · one measured token = one model forward</text>

  <text x="40" y="112" fill="#e2e8f0" font-family="sans-serif" font-size="18" font-weight="700">microLLM / PyTorch throughput</text>
  <line x1="298.6" y1="128" x2="298.6" y2="522" stroke="#e2e8f0" stroke-dasharray="5 4"/>
  <text x="288" y="542" fill="#e2e8f0" font-family="sans-serif" font-size="12">1× parity</text>
  <text x="124" y="132" fill="#94a3b8" font-family="sans-serif" font-size="12">0×</text>
  <text x="546" y="132" fill="#94a3b8" font-family="sans-serif" font-size="12">3.5×</text>

  <g font-family="sans-serif" font-size="13">
    <text x="40" y="168" fill="#f8fafc" font-weight="700">Qwen</text>
    <text x="40" y="198" fill="#cbd5e1">T8 B1</text><rect x="124" y="184" width="519" height="18" rx="3" fill="#22c55e"/><text x="650" y="198" fill="#dcfce7">3.029×</text>
    <text x="40" y="228" fill="#cbd5e1">T8 B8</text><rect x="124" y="214" width="577" height="18" rx="3" fill="#22c55e"/><text x="708" y="228" fill="#dcfce7">3.366×</text>
    <text x="40" y="258" fill="#cbd5e1">T512 B1</text><rect x="124" y="244" width="445" height="18" rx="3" fill="#22c55e"/><text x="576" y="258" fill="#dcfce7">2.598×</text>
    <text x="40" y="288" fill="#cbd5e1">T512 B8</text><rect x="124" y="274" width="430" height="18" rx="3" fill="#22c55e"/><text x="561" y="288" fill="#dcfce7">2.511×</text>
    <text x="40" y="318" fill="#cbd5e1">T2048 B1</text><rect x="124" y="304" width="257" height="18" rx="3" fill="#22c55e"/><text x="388" y="318" fill="#dcfce7">1.499×</text>
    <text x="40" y="348" fill="#cbd5e1">T2048 B8</text><rect x="124" y="334" width="173" height="18" rx="3" fill="#22c55e"/><text x="304" y="348" fill="#dcfce7">1.012×</text>

    <text x="40" y="388" fill="#f8fafc" font-weight="700">DeepSeek</text>
    <text x="40" y="418" fill="#cbd5e1">T8 B1</text><rect x="124" y="404" width="407" height="18" rx="3" fill="#22c55e"/><text x="538" y="418" fill="#dcfce7">2.372×</text>
    <text x="40" y="448" fill="#cbd5e1">T8 B8</text><rect x="124" y="434" width="367" height="18" rx="3" fill="#22c55e"/><text x="498" y="448" fill="#dcfce7">2.142×</text>
    <text x="40" y="478" fill="#cbd5e1">T512 B1</text><rect x="124" y="464" width="287" height="18" rx="3" fill="#22c55e"/><text x="418" y="478" fill="#dcfce7">1.674×</text>
    <text x="40" y="508" fill="#cbd5e1">T512 B8</text><rect x="124" y="494" width="249" height="18" rx="3" fill="#22c55e"/><text x="380" y="508" fill="#dcfce7">1.450×</text>
    <text x="40" y="578" fill="#cbd5e1">T2048 B1</text><rect x="124" y="564" width="148" height="18" rx="3" fill="#f59e0b"/><text x="279" y="578" fill="#fef3c7">0.866×</text>
    <text x="40" y="608" fill="#cbd5e1">T2048 B8</text><rect x="124" y="594" width="115" height="18" rx="3" fill="#f59e0b"/><text x="246" y="608" fill="#fef3c7">0.671×</text>
  </g>

  <rect x="750" y="112" width="330" height="425" rx="12" fill="#111827" stroke="#334155"/>
  <text x="775" y="148" fill="#e2e8f0" font-family="sans-serif" font-size="18" font-weight="700">B8 peak memory · GiB</text>
  <text x="775" y="174" fill="#94a3b8" font-family="sans-serif" font-size="12">microLLM / PyTorch</text>
  <g font-family="sans-serif" font-size="14">
    <text x="775" y="218" fill="#f8fafc" font-weight="700">Qwen</text>
    <text x="775" y="248" fill="#cbd5e1">T8</text><text x="900" y="248" fill="#93c5fd">1.18 / 1.04</text>
    <text x="775" y="278" fill="#cbd5e1">T512</text><text x="900" y="278" fill="#93c5fd">1.45 / 3.44</text>
    <text x="775" y="308" fill="#cbd5e1">T2048</text><text x="900" y="308" fill="#93c5fd">3.58 / 10.68</text>
    <text x="775" y="358" fill="#f8fafc" font-weight="700">DeepSeek</text>
    <text x="775" y="388" fill="#cbd5e1">T8</text><text x="900" y="388" fill="#93c5fd">4.19 / 3.43</text>
    <text x="775" y="418" fill="#cbd5e1">T512</text><text x="900" y="418" fill="#93c5fd">4.60 / 5.94</text>
    <text x="775" y="448" fill="#cbd5e1">T2048</text><text x="900" y="448" fill="#93c5fd">6.93 / 13.59</text>
  </g>
  <text x="775" y="490" fill="#94a3b8" font-family="sans-serif" font-size="12">Green: meets parity</text>
  <text x="775" y="512" fill="#94a3b8" font-family="sans-serif" font-size="12">Orange: remaining gap</text>
  <text x="40" y="638" fill="#64748b" font-family="sans-serif" font-size="12">Coverage survey: one fresh process per framework/shape; small differences require repeated-process confirmation.</text>
</svg>
