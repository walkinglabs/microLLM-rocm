<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="790" viewBox="0 0 1800 790">
  <rect width="100%" height="100%" fill="#fbfcfe"/>
  <text x="900" y="48" font-family="Inter,Arial,sans-serif" font-size="30" fill="#172033" text-anchor="middle" font-weight="700">Experiment 067 · Mixed-Layer KV Cache Policy</text>
  <text x="900" y="80" font-family="Inter,Arial,sans-serif" font-size="16" fill="#5b6474" text-anchor="middle">Layer 1 FP32 · remaining layers BF16 · matched Release · MI300X</text>
  <rect x="70" y="125" width="520" height="510" fill="#fff" stroke="#cbd3df" rx="10"/>
  <text x="330" y="170" font-family="Inter,Arial,sans-serif" font-size="20" fill="#172033" text-anchor="middle" font-weight="700">DeepSeek T512 B1 logits</text>
  <line x1="130" y1="510" x2="530" y2="510" stroke="#cbd3df"/>
  <line x1="130" y1="235" x2="530" y2="235" stroke="#d9534f" stroke-dasharray="7 6"/>
  <text x="120" y="240" font-family="Inter,Arial,sans-serif" font-size="13" fill="#b33b37" text-anchor="end">RMSE 0.05</text>
  <rect x="185" y="188" width="110" height="322" fill="#d9534f" rx="5"/>
  <rect x="365" y="292" width="110" height="218" fill="#18a558" rx="5"/>
  <text x="240" y="175" font-family="Inter,Arial,sans-serif" font-size="18" fill="#b33b37" text-anchor="middle">0.0586 fail</text>
  <text x="420" y="279" font-family="Inter,Arial,sans-serif" font-size="18" fill="#16874b" text-anchor="middle">0.0395 pass</text>
  <text x="240" y="545" font-family="Inter,Arial,sans-serif" font-size="15" fill="#172033" text-anchor="middle">uniform BF16</text>
  <text x="420" y="545" font-family="Inter,Arial,sans-serif" font-size="15" fill="#172033" text-anchor="middle">layer 1 FP32</text>
  <rect x="120" y="575" width="420" height="42" fill="#f5f7fa" stroke="#d8dee8" rx="6"/>
  <text x="330" y="602" font-family="Inter,Arial,sans-serif" font-size="14" fill="#5b6474" text-anchor="middle">12/12 shapes · finite · top token · suffix · logits gate pass</text>

  <rect x="630" y="125" width="550" height="510" fill="#fff" stroke="#cbd3df" rx="10"/>
  <text x="905" y="170" font-family="Inter,Arial,sans-serif" font-size="20" fill="#172033" text-anchor="middle" font-weight="700">T2048 B8 Cache MiB</text>
  <g font-family="Inter,Arial,sans-serif" font-size="14">
    <text x="680" y="225" fill="#172033" font-weight="700">Qwen</text>
    <rect x="760" y="200" width="330" height="30" fill="#d5dae2"/><text x="1098" y="222" fill="#5b6474">387 FP32</text>
    <rect x="760" y="242" width="165" height="30" fill="#18a558"/><text x="935" y="264" fill="#16874b">193.5 uniform</text>
    <rect x="760" y="284" width="172" height="30" fill="#f2a65a"/><text x="942" y="306" fill="#9a4f00">201.6 hybrid</text>
    <text x="680" y="390" fill="#172033" font-weight="700">DeepSeek</text>
    <rect x="760" y="365" width="330" height="30" fill="#d5dae2"/><text x="1098" y="387" fill="#5b6474">903 FP32</text>
    <rect x="760" y="407" width="165" height="30" fill="#18a558"/><text x="935" y="429" fill="#16874b">451.5 uniform</text>
    <rect x="760" y="449" width="171" height="30" fill="#f2a65a"/><text x="941" y="471" fill="#9a4f00">467.6 hybrid</text>
  </g>
  <rect x="680" y="525" width="450" height="82" fill="#eefaf3" stroke="#9bd5b1" rx="8"/>
  <text x="705" y="558" font-family="Inter,Arial,sans-serif" font-size="15" fill="#16874b" font-weight="700">Still much smaller than FP32</text>
  <text x="705" y="587" font-family="Inter,Arial,sans-serif" font-size="15" fill="#172033">Qwen 1.920× · DeepSeek 1.931× reduction</text>

  <rect x="1220" y="125" width="510" height="510" fill="#fff" stroke="#cbd3df" rx="10"/>
  <text x="1475" y="170" font-family="Inter,Arial,sans-serif" font-size="20" fill="#172033" text-anchor="middle" font-weight="700">Explicit trade-off</text>
  <rect x="1270" y="210" width="410" height="90" fill="#eefaf3" stroke="#9bd5b1" rx="8"/>
  <text x="1295" y="244" font-family="Inter,Arial,sans-serif" font-size="16" fill="#16874b" font-weight="700">Precision recovered</text>
  <text x="1295" y="274" font-family="Inter,Arial,sans-serif" font-size="15" fill="#172033">DeepSeek RMSE 0.0586 → 0.0395</text>
  <rect x="1270" y="330" width="410" height="110" fill="#fff7ed" stroke="#fdba74" rx="8"/>
  <text x="1295" y="364" font-family="Inter,Arial,sans-serif" font-size="16" fill="#9a4f00" font-weight="700">Performance cost</text>
  <text x="1295" y="394" font-family="Inter,Arial,sans-serif" font-size="15" fill="#172033">worst steady decode −2.43%</text>
  <text x="1295" y="422" font-family="Inter,Arial,sans-serif" font-size="15" fill="#172033">DeepSeek T2048 B8 E2E −13.4%</text>
  <rect x="1270" y="470" width="410" height="115" fill="#f5f7fa" stroke="#d8dee8" rx="8"/>
  <text x="1295" y="504" font-family="Inter,Arial,sans-serif" font-size="16" fill="#172033" font-weight="700">Policy order</text>
  <text x="1295" y="534" font-family="Inter,Arial,sans-serif" font-size="14" fill="#172033">default FP32 · speed uniform BF16</text>
  <text x="1295" y="562" font-family="Inter,Arial,sans-serif" font-size="14" fill="#172033">strict logits: layer 1 FP32, rest BF16</text>
  <text x="900" y="705" font-family="Inter,Arial,sans-serif" font-size="18" fill="#9a4f00" text-anchor="middle" font-weight="700">Keep as an explicit strict policy—not a hidden model-name heuristic or universal default</text>
</svg>
