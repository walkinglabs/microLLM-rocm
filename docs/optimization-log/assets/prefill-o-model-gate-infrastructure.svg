<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="540" viewBox="0 0 1420 540">
  <rect width="1420" height="540" fill="#0b1020"/>
  <style>text{font-family:ui-monospace,SFMono-Regular,monospace;fill:#e5e7eb}.title{font-size:25px;font-weight:700}.sub{font-size:12px;fill:#94a3b8}.head{font-size:14px;font-weight:700}.small{font-size:11px;fill:#94a3b8}</style>
  <text x="38" y="44" class="title">Scoped O projection · complete model gate</text>
  <text x="38" y="70" class="sub">same exact core · candidate adds one O key · 32 fresh processes</text>
  <rect x="90" y="125" width="360" height="105" rx="12" fill="#131b2e" stroke="#64748b"/><text x="270" y="163" class="head" text-anchor="middle">exact-core</text><text x="270" y="190" class="small" text-anchor="middle">4 entries · 140 dispatch</text><text x="270" y="212" class="small" text-anchor="middle">O default</text>
  <rect x="530" y="125" width="360" height="105" rx="12" fill="#131b2e" stroke="#22c55e"/><text x="710" y="163" class="head" text-anchor="middle">exact-core-o</text><text x="710" y="190" class="small" text-anchor="middle">5 entries · 168 dispatch</text><text x="710" y="212" class="small" text-anchor="middle">O 296100</text>
  <rect x="970" y="125" width="360" height="105" rx="12" fill="#131b2e" stroke="#38bdf8"/><text x="1150" y="163" class="head" text-anchor="middle">B1/B2/B4/B8</text><text x="1150" y="190" class="small" text-anchor="middle">2 precision + 2 performance</text><text x="1150" y="212" class="small" text-anchor="middle">reverse order on run 2</text>
  <line x1="120" y1="340" x2="1300" y2="340" stroke="#334155" stroke-width="4"/><circle cx="280" cy="340" r="12" fill="#22c55e"/><text x="280" y="378" class="small" text-anchor="middle">core + cache</text><circle cx="570" cy="340" r="12" fill="#38bdf8"/><text x="570" y="378" class="small" text-anchor="middle">151,936 logits</text><circle cx="860" cy="340" r="12" fill="#f97316"/><text x="860" y="378" class="small" text-anchor="middle">prefill ≥0.95×</text><circle cx="1150" cy="340" r="12" fill="#22c55e"/><text x="1150" y="378" class="small" text-anchor="middle">peak / allocation</text><circle cx="1300" cy="340" r="12" fill="#64748b"/><text x="1300" y="378" class="small" text-anchor="middle">admit</text>
  <rect x="90" y="445" width="1240" height="45" rx="9" fill="#111827" stroke="#334155"/><text x="120" y="473" class="sub">Trace success is necessary, never sufficient: complete logits and every-batch performance still decide.</text>
</svg>
