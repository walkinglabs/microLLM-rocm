    <rect x="210" y="266" width="220" height="39" fill="#22c55e"/>
    <rect x="210" y="262" width="220" height="4" fill="#64748b"/>
    <rect x="210" y="261" width="220" height="1" fill="#e2e8f0"/>
    <rect x="570" y="326" width="220" height="174" fill="#ef4444"/>
    <rect x="570" y="265" width="220" height="61" fill="#f59e0b"/>
    <rect x="570" y="217" width="220" height="48" fill="#38bdf8"/>
    <rect x="570" y="188" width="220" height="29" fill="#a78bfa"/>
    <rect x="570" y="111" width="220" height="77" fill="#22c55e"/>
    <rect x="570" y="104" width="220" height="7" fill="#64748b"/>
    <rect x="570" y="102" width="220" height="2" fill="#e2e8f0"/>
  </g>
  <g fill="#cbd5e1" font-family="sans-serif" text-anchor="middle">
    <text x="320" y="530" font-size="16">Qwen · 1.080 GB</text>
    <text x="680" y="530" font-size="16">DeepSeek · 1.817 GB</text>
  </g>
  <rect x="90" y="555" width="830" height="42" rx="7" fill="#111827" stroke="#334155"/>
