<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="620" viewBox="0 0 1000 620" role="img" aria-labelledby="title desc">
  <title id="title">T512 allocation bytes by model source</title>
  <desc id="desc">Attention core is the largest logical allocation source for both models.</desc>
  <rect width="1000" height="620" fill="#0b1020"/>
  <text x="48" y="48" fill="#f8fafc" font-family="sans-serif" font-size="25" font-weight="700">The next target is measured, not guessed</text>
  <text x="48" y="76" fill="#94a3b8" font-family="sans-serif" font-size="14">T512 B1 · one forward · three identical fresh-process distributions per model</text>
  <line x1="90" y1="500" x2="920" y2="500" stroke="#475569"/>
  <g>
    <rect x="210" y="374" width="220" height="126" fill="#ef4444"/>
    <rect x="210" y="344" width="220" height="30" fill="#f59e0b"/>
    <rect x="210" y="320" width="220" height="24" fill="#38bdf8"/>
