<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="590" viewBox="0 0 1040 590" role="img" aria-labelledby="title desc">
  <title id="title">Official FP8 global scale grid RMS errors</title>
  <desc id="desc">Best RMS error at each activation scale for Qwen and DeepSeek compared with the 0.05 gate.</desc>
  <rect width="1040" height="590" rx="18" fill="#0b1020"/>
  <text x="52" y="52" fill="#f8fafc" font-size="28" font-family="sans-serif" font-weight="700">FP8 全局 scale 网格：32 个候选，0 个过门</text>
  <text x="52" y="82" fill="#94a3b8" font-size="16" font-family="sans-serif">每个点取四个 weight scale 中最低 RMS；虚线是 0.05 精度门</text>
  <g stroke="#334155" stroke-width="1">
    <line x1="100" y1="460" x2="940" y2="460"/><line x1="100" y1="350" x2="940" y2="350"/>
    <line x1="100" y1="240" x2="940" y2="240"/><line x1="100" y1="130" x2="940" y2="130"/>
  </g>
  <g fill="#94a3b8" font-size="14" font-family="sans-serif">
    <text x="58" y="465">0</text><text x="50" y="355">1.0</text><text x="50" y="245">2.0</text><text x="50" y="135">3.0</text>
    <text x="135" y="500">0.00625</text><text x="350" y="500">0.0125</text><text x="570" y="500">0.025</text><text x="800" y="500">0.05</text>
    <text x="420" y="535">activation scale</text>
  </g>
  <line x1="100" y1="454.5" x2="940" y2="454.5" stroke="#fbbf24" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="790" y="447" fill="#fbbf24" font-size="14" font-family="sans-serif">RMS gate 0.05</text>
  <polyline points="160,110 380,113 600,142 820,249" fill="none" stroke="#38bdf8" stroke-width="5"/>
  <polyline points="160,220 380,191 600,180 820,160" fill="none" stroke="#fb7185" stroke-width="5"/>
  <g fill="#38bdf8"><circle cx="160" cy="110" r="7"/><circle cx="380" cy="113" r="7"/><circle cx="600" cy="142" r="7"/><circle cx="820" cy="249" r="7"/></g>
  <g fill="#fb7185"><circle cx="160" cy="220" r="7"/><circle cx="380" cy="191" r="7"/><circle cx="600" cy="180" r="7"/><circle cx="820" cy="160" r="7"/></g>
  <g fill="#e2e8f0" font-size="14" font-family="sans-serif">
    <text x="136" y="100">3.84</text><text x="356" y="103">3.15</text><text x="576" y="132">2.89</text><text x="796" y="239">1.92</text>
    <text x="136" y="242">2.18</text><text x="356" y="213">2.44</text><text x="576" y="202">2.54</text><text x="796" y="182">2.73</text>
  </g>
  <g font-family="sans-serif" font-size="16"><rect x="285" y="558" width="16" height="16" fill="#38bdf8"/><text x="311" y="572" fill="#cbd5e1">Qwen 最低 RMS</text><rect x="525" y="558" width="16" height="16" fill="#fb7185"/><text x="551" y="572" fill="#cbd5e1">DeepSeek 最低 RMS</text></g>
</svg>
