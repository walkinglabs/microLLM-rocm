  <text x="750" y="331" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#172033">0.972× – 0.981×</text>
  <text x="750" y="360" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#5b6474">candidate/current throughput</text>

