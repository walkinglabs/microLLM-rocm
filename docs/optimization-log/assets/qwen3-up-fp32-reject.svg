  <text x="1216" y="639" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">0.981</text>

  <rect x="55" y="705" width="1390" height="65" rx="18" fill="#fee2e2" stroke="#ef4444" stroke-width="2"/>
