  <text x="1132" y="519" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">0.972</text>
  <text x="85" y="548" font-family="Inter,Arial,sans-serif" font-size="14" fill="#5b6474">T32 decode</text>
