  <text x="1169" y="549" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">0.976</text>
  <text x="85" y="578" font-family="Inter,Arial,sans-serif" font-size="14" fill="#5b6474">T128 decode</text>
  <rect x="250" y="565" width="904" height="18" rx="9" fill="#2563eb"/>
  <text x="1169" y="579" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">0.976</text>
  <text x="85" y="608" font-family="Inter,Arial,sans-serif" font-size="14" fill="#5b6474">T512 prefill</text>
