  <text x="340" y="609" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#b42335">0.888</text>
  <text x="85" y="638" font-family="Inter,Arial,sans-serif" font-size="14" fill="#5b6474">T512 decode</text>
