<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="720" viewBox="0 0 1180 720" role="img" aria-labelledby="title desc">
  <title id="title">E5 activation format versus E4 control</title>
  <desc id="desc">All eight complete-logit maximum and RMS error ratios are worse with E5 activation.</desc>
  <rect width="1180" height="720" rx="20" fill="#0b1020"/>
  <text x="56" y="58" fill="#f8fafc" font-size="29" font-family="sans-serif" font-weight="700">E5 activation：范围更大，八项完整误差全部更差</text>
  <text x="56" y="91" fill="#94a3b8" font-size="16" font-family="sans-serif">同revision E4 control = 1.0；红条越长表示误差回归越大</text>
  <line x1="300" y1="125" x2="300" y2="585" stroke="#94a3b8" stroke-width="2"/>
  <text x="282" y="615" fill="#cbd5e1" font-size="14" font-family="sans-serif">1.0×</text>
  <g fill="#cbd5e1" font-size="15" font-family="sans-serif">
    <text x="55" y="160">Qwen T8 Max</text><text x="55" y="215">Qwen T8 RMS</text>
    <text x="55" y="270">Qwen T512 Max</text><text x="55" y="325">Qwen T512 RMS</text>
    <text x="55" y="380">DeepSeek T8 Max</text><text x="55" y="435">DeepSeek T8 RMS</text>
    <text x="55" y="490">DeepSeek T512 Max</text><text x="55" y="545">DeepSeek T512 RMS</text>
  </g>
  <g fill="#ef4444">
    <rect x="300" y="140" width="140" height="28" rx="5"/><rect x="300" y="195" width="141" height="28" rx="5"/>
    <rect x="300" y="250" width="122" height="28" rx="5"/><rect x="300" y="305" width="270" height="28" rx="5"/>
    <rect x="300" y="360" width="254" height="28" rx="5"/><rect x="300" y="415" width="324" height="28" rx="5"/>
    <rect x="300" y="470" width="444" height="28" rx="5"/><rect x="300" y="525" width="583" height="28" rx="5"/>
  </g>
  <g fill="#f8fafc" font-size="14" font-family="sans-serif" font-weight="700">
    <text x="450" y="160">1.58×</text><text x="451" y="215">1.59×</text>
    <text x="432" y="270">1.51×</text><text x="580" y="325">2.12×</text>
    <text x="564" y="380">2.06×</text><text x="634" y="435">2.35×</text>
    <text x="754" y="490">2.85×</text><text x="893" y="545">3.43×</text>
  </g>
  <rect x="140" y="635" width="900" height="55" rx="13" fill="#111827" stroke="#334155"/>
  <text x="190" y="660" fill="#cbd5e1" font-size="16" font-family="sans-serif">T512 TPS：Q +0.06% · Deep -0.30%　显存增量：0</text>
  <text x="190" y="682" fill="#fca5a5" font-size="16" font-family="sans-serif">keep=false · 删除模型/CLI E5策略，保留底层混合格式原语</text>
</svg>
