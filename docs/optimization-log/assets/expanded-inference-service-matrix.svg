  <text x="62" y="829" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#166534">Both caches are exactly 2.00× smaller</text>
  <text x="62" y="855" font-family="Inter,Arial,sans-serif" font-size="13" fill="#64748b">Peak memory falls less: weights and temporary activations remain.</text>

  <rect x="762" y="512" width="700" height="374" rx="14" fill="#ffffff" stroke="#dbe4ee"/>
  <text x="786" y="548" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#111827">What the wider matrix changed</text>
