  <text x="62" y="548" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#111827">KV Storage · T2048 B8</text>
  <g font-family="Inter,Arial,sans-serif" font-size="14" fill="#334155">
