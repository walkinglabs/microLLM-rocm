  <text x="750" y="925" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="13" fill="#64748b">Raw evidence: docs/optimization-log/experiments/076-data · ratios are a one-process survey, not stable small-delta rankings</text>
