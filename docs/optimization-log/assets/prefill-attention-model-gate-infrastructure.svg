  <rect x="1040" y="350" width="380" height="130" rx="12" fill="#111827" stroke="#f97316"/><text x="1230" y="388" class="head" text-anchor="middle">end-to-end</text><text x="1230" y="420" class="small" text-anchor="middle">full cached prefill wall / tokens/s</text><text x="1230" y="446" class="small" text-anchor="middle">every batch ≥0.95× · peak recorded</text>
