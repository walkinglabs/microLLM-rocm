<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="580" viewBox="0 0 1040 580" role="img" aria-labelledby="title desc">
  <title id="title">FP8 activation scale boundary expansion</title>
  <desc id="desc">Best complete-logit RMS errors fall as the activation scale upper boundary expands, but remain above the precision gate.</desc>
  <rect width="1040" height="580" rx="18" fill="#0b1020"/>
  <text x="52" y="52" fill="#f8fafc" font-size="28" font-family="sans-serif" font-weight="700">FP8 边界扩展：误差下降，但仍没过门</text>
  <text x="52" y="82" fill="#94a3b8" font-size="16" font-family="sans-serif">每个activation取四个weight候选中满足top相同的最低RMS</text>
  <g stroke="#334155"><line x1="110" y1="460" x2="940" y2="460"/><line x1="110" y1="350" x2="940" y2="350"/><line x1="110" y1="240" x2="940" y2="240"/><line x1="110" y1="130" x2="940" y2="130"/></g>
  <g fill="#94a3b8" font-size="14" font-family="sans-serif"><text x="68" y="465">0</text><text x="60" y="355">1.0</text><text x="60" y="245">2.0</text><text x="60" y="135">3.0</text><text x="170" y="500">0.025</text><text x="380" y="500">0.05</text><text x="590" y="500">0.1</text><text x="805" y="500">0.2</text><text x="435" y="535">activation scale</text></g>
  <line x1="110" y1="454.5" x2="940" y2="454.5" stroke="#fbbf24" stroke-width="3" stroke-dasharray="10 8"/>
  <text x="790" y="447" fill="#fbbf24" font-size="14" font-family="sans-serif">RMS gate 0.05</text>
  <polyline points="200,142 410,249 620,326 830,386" fill="none" stroke="#38bdf8" stroke-width="5"/>
  <polyline points="200,180 410,160 620,194 830,331" fill="none" stroke="#fb7185" stroke-width="5"/>
  <g fill="#38bdf8"><circle cx="200" cy="142" r="7"/><circle cx="410" cy="249" r="7"/><circle cx="620" cy="326" r="7"/><circle cx="830" cy="386" r="7"/></g>
  <g fill="#fb7185"><circle cx="200" cy="180" r="7"/><circle cx="410" cy="160" r="7"/><circle cx="620" cy="194" r="7"/><circle cx="830" cy="331" r="7"/></g>
  <g fill="#e2e8f0" font-size="14" font-family="sans-serif"><text x="176" y="132">2.89</text><text x="386" y="239">1.92</text><text x="596" y="316">1.22</text><text x="806" y="376">0.669</text><text x="176" y="202">2.54</text><text x="386" y="182">2.73</text><text x="596" y="216">2.35</text><text x="806" y="353">1.17</text></g>
  <g font-family="sans-serif" font-size="16"><rect x="285" y="552" width="16" height="16" fill="#38bdf8"/><text x="311" y="566" fill="#cbd5e1">Qwen</text><rect x="510" y="552" width="16" height="16" fill="#fb7185"/><text x="536" y="566" fill="#cbd5e1">DeepSeek</text></g>
</svg>
