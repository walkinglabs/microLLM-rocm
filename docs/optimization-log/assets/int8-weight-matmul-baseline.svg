<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="700" viewBox="0 0 1500 700">
  <rect width="1500" height="700" fill="#f8fafc"/>
  <text x="750" y="50" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="29" font-weight="700" fill="#172033">Experiment 353 · INT8 Weight Matmul Baseline</text>
  <text x="750" y="80" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" fill="#64748b">correctness control before a fused or native performance route</text>
  <g font-family="Inter,Arial,sans-serif">
    <rect x="80" y="155" width="245" height="105" rx="12" fill="#eff6ff" stroke="#60a5fa"/>
    <text x="202" y="198" text-anchor="middle" font-size="19" font-weight="700" fill="#1e40af">input [M,K]</text>
    <text x="202" y="228" text-anchor="middle" font-size="15" fill="#475569">FP32 / FP16 / BF16</text>
    <rect x="80" y="355" width="245" height="105" rx="12" fill="#ecfdf5" stroke="#4ade80"/>
    <text x="202" y="398" text-anchor="middle" font-size="19" font-weight="700" fill="#166534">weight [K,N]</text>
    <text x="202" y="428" text-anchor="middle" font-size="15" fill="#475569">I8 values + F32 scale</text>
    <path d="M325 407 H445 V315" fill="none" stroke="#64748b" stroke-width="3"/>
    <path d="M325 207 H445 V275" fill="none" stroke="#64748b" stroke-width="3"/>
    <rect x="445" y="240" width="285" height="145" rx="12" fill="#fff7ed" stroke="#f59e0b" stroke-width="2"/>
    <text x="587" y="282" text-anchor="middle" font-size="19" font-weight="700" fill="#92400e">explicit dequantize</text>
    <text x="587" y="315" text-anchor="middle" font-size="16" fill="#475569">allocate full floating [K,N]</text>
    <text x="587" y="345" text-anchor="middle" font-size="15" fill="#b45309">correct but loses compact temp</text>
    <path d="M730 312 H850" stroke="#64748b" stroke-width="3"/>
    <rect x="850" y="240" width="250" height="145" rx="12" fill="#eef2ff" stroke="#818cf8"/>
    <text x="975" y="290" text-anchor="middle" font-size="20" font-weight="700" fill="#3730a3">ordinary matmul</text>
    <text x="975" y="325" text-anchor="middle" font-size="15" fill="#475569">existing CPU / hipBLASLt path</text>
    <path d="M1100 312 H1190" stroke="#64748b" stroke-width="3"/>
    <rect x="1190" y="260" width="230" height="105" rx="12" fill="#ecfdf5" stroke="#4ade80"/>
    <text x="1305" y="302" text-anchor="middle" font-size="19" font-weight="700" fill="#166534">output [M,N]</text>
    <text x="1305" y="332" text-anchor="middle" font-size="15" fill="#475569">CPU = HIP = PyTorch</text>
    <rect x="250" y="535" width="1000" height="80" rx="12" fill="#fff" stroke="#cbd5e1"/>
    <text x="750" y="570" text-anchor="middle" font-size="18" font-weight="700" fill="#166534">KEEP as oracle: full output passes · HIP measured path has 0 D2H</text>
    <text x="750" y="598" text-anchor="middle" font-size="16" fill="#92400e">NOT a speed claim: the full floating weight temporary is still allocated</text>
  </g>
</svg>
