<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Two fixed buckets improve median but damage tail latency under skew</title>
  <desc id="desc">Ratios of bucketed over uniform throughput, median TTFT and P95 TTFT for three traffic patterns.</desc>
  <rect width="1000" height="560" rx="18" fill="#0b1020"/>
  <text x="52" y="52" fill="#f8fafc" font-size="28" font-family="sans-serif" font-weight="700">偏斜流量：Bucket2 / Uniform</text>
  <text x="52" y="82" fill="#94a3b8" font-size="16" font-family="sans-serif">两模型方向一致；柱长超过100%表示更慢</text>
  <line x1="320" y1="112" x2="320" y2="475" stroke="#64748b" stroke-width="2"/>
  <line x1="500" y1="112" x2="500" y2="475" stroke="#f8fafc" stroke-opacity="0.45" stroke-dasharray="6 6"/>
  <text x="482" y="106" fill="#cbd5e1" font-size="14" font-family="sans-serif">100%</text>
  <g font-family="sans-serif" font-size="18" fill="#e2e8f0">
    <text x="52" y="172">short-heavy</text><text x="52" y="302">long-heavy</text><text x="52" y="432">delayed</text>
  </g>
  <g>
    <rect x="320" y="132" width="131" height="22" rx="5" fill="#38bdf8"/><rect x="320" y="160" width="54" height="22" rx="5" fill="#22c55e"/><rect x="320" y="188" width="579" height="22" rx="5" fill="#fb7185"/>
    <rect x="320" y="262" width="103" height="22" rx="5" fill="#38bdf8"/><rect x="320" y="290" width="122" height="22" rx="5" fill="#22c55e"/><rect x="320" y="318" width="543" height="22" rx="5" fill="#fb7185"/>
    <rect x="320" y="392" width="169" height="22" rx="5" fill="#38bdf8"/><rect x="320" y="420" width="194" height="22" rx="5" fill="#22c55e"/><rect x="320" y="448" width="194" height="22" rx="5" fill="#fb7185"/>
  </g>
  <g font-family="monospace" font-size="15" fill="#f8fafc">
    <text x="458" y="149">TPS 73%</text><text x="382" y="177">P50 30%</text><text x="907" y="205">P95 321%</text>
    <text x="430" y="279">TPS 57%</text><text x="449" y="307">P50 68%</text><text x="870" y="335">P95 302%</text>
    <text x="496" y="409">TPS 94%</text><text x="521" y="437">P50 108%</text><text x="521" y="465">P95 108%</text>
  </g>
  <g font-family="sans-serif" font-size="15" fill="#cbd5e1">
    <rect x="80" y="510" width="16" height="16" rx="3" fill="#38bdf8"/><text x="106" y="524">吞吐</text>
    <rect x="210" y="510" width="16" height="16" rx="3" fill="#22c55e"/><text x="236" y="524">focus TTFT P50</text>
    <rect x="420" y="510" width="16" height="16" rx="3" fill="#fb7185"/><text x="446" y="524">focus TTFT P95</text>
    <text x="680" y="524" fill="#94a3b8">P50改善不能掩盖排队尾部</text>
  </g>
</svg>
