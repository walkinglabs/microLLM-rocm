<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="660" viewBox="0 0 1160 660" role="img" aria-labelledby="title desc">
  <title id="title">Attention-only output-channel FP8 weights</title>
  <desc id="desc">Seven of eight Max and RMS metrics improve; Qwen T512 RMS regresses while both T512 performance gates pass.</desc>
  <rect width="1160" height="660" rx="20" fill="#0b1020"/>
  <text x="56" y="58" fill="#f8fafc" font-size="29" font-family="sans-serif" font-weight="700">Attention-only：八项改善七项，但不能掩盖唯一红条</text>
  <text x="56" y="91" fill="#94a3b8" font-size="16" font-family="sans-serif">同revision control；绿色=误差下降，红色=误差上升</text>
  <line x1="90" y1="315" x2="1070" y2="315" stroke="#64748b" stroke-width="2"/>
  <rect x="130" y="315" width="90" height="93" fill="#22c55e"/><rect x="225" y="315" width="90" height="108" fill="#22c55e"/>
  <rect x="380" y="315" width="90" height="102" fill="#22c55e"/><rect x="475" y="226" width="90" height="89" fill="#fb7185"/>
  <rect x="650" y="315" width="90" height="87" fill="#22c55e"/><rect x="745" y="315" width="90" height="78" fill="#22c55e"/>
  <rect x="900" y="315" width="90" height="163" fill="#22c55e"/><rect x="995" y="315" width="90" height="143" fill="#22c55e"/>
  <g fill="#f8fafc" font-size="13" font-family="sans-serif"><text x="132" y="430">Max -9.31%</text><text x="225" y="445">RMS -10.80%</text><text x="382" y="439">Max -10.20%</text><text x="475" y="215">RMS +8.91%</text><text x="652" y="424">Max -8.70%</text><text x="747" y="415">RMS -7.75%</text><text x="902" y="500">Max -16.26%</text><text x="995" y="480">RMS -14.32%</text></g>
  <g fill="#cbd5e1" font-size="15" font-family="sans-serif"><text x="160" y="540">Q T8</text><text x="420" y="540">Q T512</text><text x="680" y="540">D T8</text><text x="930" y="540">D T512</text></g>
  <rect x="190" y="570" width="780" height="55" rx="12" fill="#111827" stroke="#334155"/><text x="238" y="605" fill="#cbd5e1" font-size="17" font-family="sans-serif">T512 TPS：Q -4.26% · Deep -4.42%（都过5%门）</text>
  <text x="385" y="648" fill="#fbbf24" font-size="16" font-family="sans-serif">keep=false；下一步只测O projection</text>
</svg>
