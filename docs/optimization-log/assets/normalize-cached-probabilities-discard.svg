<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="500" viewBox="0 0 1040 500" role="img" aria-labelledby="title desc">
  <title id="title">Cached probability normalization is bit exact but not faster</title>
  <desc id="desc">Complete logits are bit exact for batch one and eight, while alternating throughput ratios are slightly below one, so the extra shared pass is rejected.</desc>
  <rect width="1040" height="500" fill="#0b1020"/>
  <text x="40" y="44" fill="#f8fafc" font-family="sans-serif" font-size="24" font-weight="700">Experiment 091 · correct is necessary, not sufficient</text>
  <text x="40" y="72" fill="#94a3b8" font-family="sans-serif" font-size="14">Normalize shared probabilities once before cached Value accumulation</text>

  <rect x="40" y="112" width="430" height="270" rx="12" fill="#111827" stroke="#334155"/>
  <text x="66" y="150" fill="#e2e8f0" font-family="sans-serif" font-size="18" font-weight="700">Complete-logit gate</text>
  <circle cx="155" cy="234" r="50" fill="#14532d" stroke="#22c55e" stroke-width="5"/>
  <text x="155" y="228" text-anchor="middle" fill="#dcfce7" font-family="sans-serif" font-size="18" font-weight="700">B1</text>
  <text x="155" y="251" text-anchor="middle" fill="#bbf7d0" font-family="sans-serif" font-size="13">151,936 exact</text>
  <circle cx="350" cy="234" r="50" fill="#14532d" stroke="#22c55e" stroke-width="5"/>
  <text x="350" y="228" text-anchor="middle" fill="#dcfce7" font-family="sans-serif" font-size="18" font-weight="700">B8</text>
  <text x="350" y="251" text-anchor="middle" fill="#bbf7d0" font-family="sans-serif" font-size="13">1,215,488 exact</text>
  <text x="66" y="334" fill="#93c5fd" font-family="sans-serif" font-size="14">max = 0 · RMSE = 0 · tokens equal</text>

  <rect x="540" y="112" width="460" height="270" rx="12" fill="#111827" stroke="#334155"/>
  <text x="566" y="150" fill="#e2e8f0" font-family="sans-serif" font-size="18" font-weight="700">Alternating Release performance</text>
  <line x1="740" y1="180" x2="740" y2="326" stroke="#e2e8f0" stroke-dasharray="5 4"/>
  <text x="728" y="346" fill="#e2e8f0" font-family="sans-serif" font-size="12">1×</text>
  <text x="566" y="220" fill="#cbd5e1" font-family="sans-serif" font-size="15">T2048 B1</text>
  <rect x="566" y="234" width="171" height="24" rx="3" fill="#f59e0b"/><text x="752" y="252" fill="#fef3c7" font-family="sans-serif" font-size="14">0.994×</text>
  <text x="566" y="290" fill="#cbd5e1" font-family="sans-serif" font-size="15">T2048 B8</text>
  <rect x="566" y="304" width="172" height="24" rx="3" fill="#f59e0b"/><text x="752" y="322" fill="#fef3c7" font-family="sans-serif" font-size="14">0.997×</text>
  <text x="566" y="365" fill="#fbbf24" font-family="sans-serif" font-size="14" font-weight="700">No benefit · extra barrier · DISCARD</text>

  <text x="40" y="446" fill="#94a3b8" font-family="sans-serif" font-size="14">Candidate fully reverted; allocator, D2H, peak and tokens were controlled.</text>
</svg>
