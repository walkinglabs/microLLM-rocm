    <rect x="355" y="312" width="120" height="52" fill="#fef3c7" stroke="#f59e0b"/><text x="415" y="344" fill="#92400e">t1 h2</text>
  </g>
  <path d="M175 380 V470" stroke="#2563eb" stroke-width="5"/>
  <path d="M295 380 V470" stroke="#16a34a" stroke-width="5"/>
  <path d="M415 380 V470" stroke="#d97706" stroke-width="5"/>
  <text x="535" y="410" font-family="Inter,Arial,sans-serif" font-size="16" fill="#334155">ld = H×D</text>
  <text x="535" y="442" font-family="Inter,Arial,sans-serif" font-size="16" fill="#334155">head stride = D</text>
  <rect x="115" y="500" width="500" height="125" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="365" y="538" font-family="Inter,Arial,sans-serif" font-size="17" fill="#1e40af" text-anchor="middle" font-weight="700">No BTHD → BHTD copy</text>
  <text x="365" y="575" font-family="monospace" font-size="16" fill="#334155" text-anchor="middle">P[B,H,T,T] × V[B,T,H,D]</text>
  <text x="365" y="605" font-family="monospace" font-size="16" fill="#334155" text-anchor="middle">→ context[B,T,H,D]</text>

