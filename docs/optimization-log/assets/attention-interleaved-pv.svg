  <rect x="1020" y="618" width="80" height="7" fill="#94a3b8"/><text x="1060" y="655" font-family="Inter,Arial,sans-serif" font-size="14" fill="#334155" text-anchor="middle">edge</text>
  <rect x="1140" y="583" width="80" height="42" fill="#60a5fa"/><text x="1180" y="655" font-family="Inter,Arial,sans-serif" font-size="14" fill="#334155" text-anchor="middle">T32</text>
  <rect x="1260" y="388" width="80" height="237" fill="#3b82f6"/><text x="1300" y="655" font-family="Inter,Arial,sans-serif" font-size="14" fill="#334155" text-anchor="middle">T128</text>
  <rect x="1380" y="314" width="80" height="311" fill="#2f9b68"/><text x="1420" y="655" font-family="Inter,Arial,sans-serif" font-size="14" fill="#334155" text-anchor="middle">Qwen</text>
  <rect x="1500" y="200" width="80" height="425" fill="#16834a"/><text x="1540" y="655" font-family="Inter,Arial,sans-serif" font-size="14" fill="#334155" text-anchor="middle">DeepSeek</text>
  <text x="1060" y="602" font-family="Inter,Arial,sans-serif" font-size="14" fill="#334155" text-anchor="middle">1.006×</text>
  <text x="1180" y="567" font-family="Inter,Arial,sans-serif" font-size="14" fill="#334155" text-anchor="middle">1.056×</text>
  <text x="1300" y="372" font-family="Inter,Arial,sans-serif" font-size="14" fill="#1e40af" text-anchor="middle" font-weight="700">1.316×</text>
  <text x="1420" y="298" font-family="Inter,Arial,sans-serif" font-size="14" fill="#166534" text-anchor="middle" font-weight="700">1.415×</text>
  <text x="1540" y="184" font-family="Inter,Arial,sans-serif" font-size="14" fill="#166534" text-anchor="middle" font-weight="700">2.200×</text>
  <text x="1250" y="695" font-family="Inter,Arial,sans-serif" font-size="14" fill="#64748b" text-anchor="middle">all Max/RMS errors = 0 · timed H2D/D2H calls = 0</text>

  <rect x="65" y="775" width="1670" height="76" rx="12" fill="#172033"/>
  <text x="900" y="807" font-family="Inter,Arial,sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">Keep the primitive; do not claim model speed until backward and the complete graph use BTHD</text>
  <text x="900" y="835" font-family="Inter,Arial,sans-serif" font-size="14" fill="#cbd5e1" text-anchor="middle">The tiny edge case is neutral; the measured benefit grows with context and width</text>
