<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="650" viewBox="0 0 1160 650" role="img" aria-labelledby="title desc">
  <title id="title">Attention output-projection-only FP8 weights</title>
  <desc id="desc">Qwen metrics are unchanged, DeepSeek metrics improve, and both T512 performance gates pass.</desc>
  <rect width="1160" height="650" rx="20" fill="#0b1020"/>
  <text x="56" y="58" fill="#f8fafc" font-size="29" font-family="sans-serif" font-weight="700">O projection-only：Qwen不变，Deep收益全部保留</text>
  <text x="56" y="91" fill="#94a3b8" font-size="16" font-family="sans-serif">同revision control；绿色=误差改善，灰色=完全不变</text>
  <line x1="90" y1="310" x2="1070" y2="310" stroke="#64748b" stroke-width="2"/>
  <rect x="130" y="308" width="100" height="4" fill="#94a3b8"/><rect x="240" y="308" width="100" height="4" fill="#94a3b8"/>
  <rect x="390" y="308" width="100" height="4" fill="#94a3b8"/><rect x="500" y="308" width="100" height="4" fill="#94a3b8"/>
  <rect x="680" y="310" width="100" height="87" fill="#22c55e"/><rect x="790" y="310" width="100" height="78" fill="#22c55e"/>
  <rect x="930" y="310" width="100" height="163" fill="#22c55e"/><rect x="1040" y="310" width="70" height="143" fill="#22c55e"/>
  <g fill="#f8fafc" font-size="13" font-family="sans-serif"><text x="152" y="292">Q T8 Max 0</text><text x="250" y="335">RMS 0</text><text x="396" y="292">Q T512 Max 0</text><text x="510" y="335">RMS 0</text><text x="683" y="420">D T8 Max -8.70%</text><text x="793" y="410">RMS -7.75%</text><text x="918" y="495">D T512 Max -16.26%</text><text x="1025" y="475">RMS -14.32%</text></g>
  <rect x="170" y="530" width="820" height="70" rx="14" fill="#111827" stroke="#334155"/><text x="220" y="563" fill="#cbd5e1" font-size="17" font-family="sans-serif">T512 TPS：Q -3.74% · Deep -1.50%（都过门）</text><text x="220" y="588" fill="#fbbf24" font-size="16" font-family="sans-serif">targeted keep=true · 完整precision仍0/4</text>
  <text x="425" y="632" fill="#94a3b8" font-size="15" font-family="sans-serif">保留O-only，删除更宽Attention-only</text>
</svg>
