<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="590" viewBox="0 0 1040 590" role="img" aria-labelledby="title desc">
  <title id="title">Official FP8 per-Tensor weight amax result</title><desc id="desc">Per-Tensor weight scales reduce RMS from the static baseline but all four model gates still fail and preparation is costly.</desc>
