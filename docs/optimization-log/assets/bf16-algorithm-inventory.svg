  <text x="470" y="305" fill="#e2e8f0" font-family="sans-serif" font-size="17">common indices</text>
  <rect x="48" y="430" width="984" height="44" rx="8" fill="#3b2a14"/>
  <text x="72" y="458" fill="#fde68a" font-family="sans-serif" font-size="16">IDs are valid only for this hipBLASLt version; no default dispatch changed.</text>
