<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500" role="img" aria-labelledby="title desc">
  <title id="title">BF16 algorithm inventory</title><desc id="desc">M32 and M64 each return 64 heuristic candidates and share 53 solution indices.</desc>
  <rect width="1080" height="500" fill="#0b1020"/>
  <text x="48" y="60" fill="#f8fafc" font-family="sans-serif" font-size="30" font-weight="700">hipBLASLt BF16 gate · candidate intersection</text>
  <circle cx="400" cy="255" r="155" fill="#164e63" fill-opacity="0.78"/>
  <circle cx="680" cy="255" r="155" fill="#4c1d95" fill-opacity="0.72"/>
  <text x="286" y="170" fill="#a5f3fc" font-family="sans-serif" font-size="20">M32 candidates</text>
  <text x="656" y="170" fill="#ddd6fe" font-family="sans-serif" font-size="20">M64 candidates</text>
  <text x="305" y="280" fill="#ecfeff" font-family="sans-serif" font-size="52" font-weight="700">64</text>
  <text x="720" y="280" fill="#f5f3ff" font-family="sans-serif" font-size="52" font-weight="700">64</text>
