<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="560" viewBox="0 0 1080 560" role="img" aria-labelledby="title desc">
  <title id="title">Single-row prefill into a shared KV cache</title>
  <desc id="desc">A new two-token prompt is computed in a temporary batch-one cache and copied into empty row zero while row one remains at position three.</desc>
  <rect width="1080" height="560" fill="#0b1020"/>
  <text x="40" y="44" fill="#f8fafc" font-family="sans-serif" font-size="24" font-weight="700">Experiment 094 · refill one empty KV slot</text>
  <text x="40" y="72" fill="#94a3b8" font-family="sans-serif" font-size="14">Correctness reference for continuous admission</text>

  <rect x="40" y="112" width="270" height="286" rx="12" fill="#111827" stroke="#334155"/>
  <text x="64" y="150" fill="#e2e8f0" font-family="sans-serif" font-size="17" font-weight="700">Before</text>
  <text x="64" y="192" fill="#cbd5e1" font-family="sans-serif" font-size="14">row 0 · empty · pos 0</text>
  <rect x="64" y="208" width="48" height="34" fill="#1f2937"/><rect x="116" y="208" width="48" height="34" fill="#1f2937"/><rect x="168" y="208" width="48" height="34" fill="#1f2937"/>
  <text x="64" y="286" fill="#cbd5e1" font-family="sans-serif" font-size="14">row 1 · old request · pos 3</text>
  <rect x="64" y="302" width="48" height="34" fill="#3b82f6"/><rect x="116" y="302" width="48" height="34" fill="#3b82f6"/><rect x="168" y="302" width="48" height="34" fill="#3b82f6"/>

  <rect x="372" y="112" width="322" height="286" rx="12" fill="#111827" stroke="#334155"/>
  <text x="396" y="150" fill="#e2e8f0" font-family="sans-serif" font-size="17" font-weight="700">Reference work</text>
  <rect x="414" y="190" width="238" height="68" rx="8" fill="#14532d" stroke="#22c55e"/>
  <text x="533" y="218" text-anchor="middle" fill="#dcfce7" font-family="sans-serif" font-size="14">new prompt → B1 prefill</text>
  <text x="533" y="242" text-anchor="middle" fill="#bbf7d0" font-family="sans-serif" font-size="12">temporary K/V · logits oracle</text>
  <path d="M533 270 V326" stroke="#22c55e" stroke-width="4" marker-end="url(#arrow)"/>
  <text x="533" y="357" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">D2D copy by layer/head</text>

  <rect x="756" y="112" width="284" height="286" rx="12" fill="#111827" stroke="#334155"/>
  <text x="780" y="150" fill="#e2e8f0" font-family="sans-serif" font-size="17" font-weight="700">After</text>
  <text x="780" y="192" fill="#cbd5e1" font-family="sans-serif" font-size="14">row 0 · new request · pos 2</text>
  <rect x="780" y="208" width="48" height="34" fill="#22c55e"/><rect x="832" y="208" width="48" height="34" fill="#22c55e"/><rect x="884" y="208" width="48" height="34" fill="#1f2937"/>
  <text x="780" y="286" fill="#cbd5e1" font-family="sans-serif" font-size="14">row 1 · unchanged · pos 3</text>
  <rect x="780" y="302" width="48" height="34" fill="#3b82f6"/><rect x="832" y="302" width="48" height="34" fill="#3b82f6"/><rect x="884" y="302" width="48" height="34" fill="#3b82f6"/>

  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#22c55e"/></marker></defs>
  <text x="40" y="462" fill="#93c5fd" font-family="sans-serif" font-size="15">[3,3] → reset row 0 → [0,3] → prefill 2 tokens → [2,3] → decode → [3,4]</text>
  <text x="40" y="496" fill="#94a3b8" font-family="sans-serif" font-size="13">FP32/BF16 · CPU/HIP · other row exact · stable shared Storage · zero execution D2H</text>
  <text x="40" y="526" fill="#fbbf24" font-family="sans-serif" font-size="13">Temporary B1 cache and D2D copies: semantic oracle, not a speed claim</text>
</svg>
