<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="930" viewBox="0 0 1800 930">
  <rect width="1800" height="930" fill="#f8fafc"/>
  <text x="900" y="52" font-family="Inter,Arial,sans-serif" font-size="30" fill="#172033" text-anchor="middle" font-weight="700">Experiment 162 · Attention RoPE Layout Fusion</text>
  <text x="900" y="84" font-family="Inter,Arial,sans-serif" font-size="16" fill="#5b6474" text-anchor="middle">Qwen / DeepSeek · BF16 Linear + FP32 master · T512 B1 · MI300X</text>

  <rect x="55" y="125" width="530" height="635" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="320" y="168" font-family="Inter,Arial,sans-serif" font-size="21" fill="#172033" text-anchor="middle" font-weight="700">The unnecessary trip</text>
  <rect x="105" y="210" width="430" height="70" rx="9" fill="#dbeafe" stroke="#60a5fa"/>
  <text x="320" y="252" font-family="monospace" font-size="18" fill="#1e3a8a" text-anchor="middle">projection [B,T,H,D]</text>
  <path d="M320 280 V330" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="105" y="330" width="430" height="70" rx="9" fill="#fee2e2" stroke="#f87171"/>
  <text x="320" y="360" font-family="Inter,Arial,sans-serif" font-size="15" fill="#991b1b" text-anchor="middle" font-weight="700">old: transpose view + materialize</text>
  <text x="320" y="384" font-family="monospace" font-size="17" fill="#991b1b" text-anchor="middle">[B,H,T,D]</text>
  <path d="M320 400 V450" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="105" y="450" width="430" height="70" rx="9" fill="#fef3c7" stroke="#f59e0b"/>
  <text x="320" y="492" font-family="Inter,Arial,sans-serif" font-size="17" fill="#92400e" text-anchor="middle">bias + split-half RoPE</text>
  <path d="M320 520 V570" stroke="#64748b" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="105" y="570" width="430" height="112" rx="9" fill="#dcfce7" stroke="#4ade80"/>
  <text x="320" y="606" font-family="Inter,Arial,sans-serif" font-size="16" fill="#166534" text-anchor="middle" font-weight="700">new: one layout-aware Kernel</text>
  <text x="320" y="638" font-family="monospace" font-size="16" fill="#166534" text-anchor="middle">read [B,T,H,D]</text>
  <text x="320" y="665" font-family="monospace" font-size="16" fill="#166534" text-anchor="middle">write [B,H,T,D]</text>

  <rect x="625" y="125" width="550" height="635" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="900" y="168" font-family="Inter,Arial,sans-serif" font-size="21" fill="#172033" text-anchor="middle" font-weight="700">Strided-copy traffic per step</text>
  <text x="680" y="230" font-family="Inter,Arial,sans-serif" font-size="16" fill="#334155">Qwen materialized</text>
  <rect x="680" y="250" width="420" height="48" rx="6" fill="#dc5a4a"/>
  <text x="1090" y="281" font-family="Inter,Arial,sans-serif" font-size="14" fill="#ffffff" text-anchor="end" font-weight="700">251.7 MB · 240 calls</text>
  <text x="680" y="335" font-family="Inter,Arial,sans-serif" font-size="16" fill="#334155">Qwen fused</text>
  <rect x="680" y="355" width="168" height="48" rx="6" fill="#2f9b68"/>
  <text x="863" y="386" font-family="Inter,Arial,sans-serif" font-size="14" fill="#166534" font-weight="700">100.7 MB · 96</text>

  <text x="680" y="475" font-family="Inter,Arial,sans-serif" font-size="16" fill="#334155">DeepSeek materialized</text>
  <rect x="680" y="495" width="420" height="48" rx="6" fill="#dc5a4a"/>
  <text x="1090" y="526" font-family="Inter,Arial,sans-serif" font-size="14" fill="#ffffff" text-anchor="end" font-weight="700">513.8 MB · 280 calls</text>
  <text x="680" y="580" font-family="Inter,Arial,sans-serif" font-size="16" fill="#334155">DeepSeek fused</text>
  <rect x="680" y="600" width="168" height="48" rx="6" fill="#2f9b68"/>
  <text x="863" y="631" font-family="Inter,Arial,sans-serif" font-size="14" fill="#166534" font-weight="700">205.5 MB · 112</text>
  <rect x="680" y="685" width="420" height="44" rx="8" fill="#ecfdf5" stroke="#86efac"/>
  <text x="890" y="713" font-family="Inter,Arial,sans-serif" font-size="17" fill="#166534" text-anchor="middle" font-weight="700">both models: 60.0% fewer bytes</text>

  <rect x="1215" y="125" width="530" height="635" rx="14" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="1480" y="168" font-family="Inter,Arial,sans-serif" font-size="21" fill="#172033" text-anchor="middle" font-weight="700">Official-model and profile gates</text>
  <rect x="1265" y="215" width="430" height="110" rx="10" fill="#f1f5f9" stroke="#94a3b8"/>
  <text x="1480" y="250" font-family="Inter,Arial,sans-serif" font-size="17" fill="#334155" text-anchor="middle" font-weight="700">Qwen</text>
  <text x="1480" y="286" font-family="Inter,Arial,sans-serif" font-size="28" fill="#334155" text-anchor="middle" font-weight="700">0.9996× throughput</text>
  <text x="1480" y="312" font-family="Inter,Arial,sans-serif" font-size="13" fill="#64748b" text-anchor="middle">peak -48.2 MB · loss diff 0.235%</text>
  <rect x="1265" y="350" width="430" height="110" rx="10" fill="#ecfdf5" stroke="#86efac"/>
  <text x="1480" y="385" font-family="Inter,Arial,sans-serif" font-size="17" fill="#166534" text-anchor="middle" font-weight="700">DeepSeek</text>
  <text x="1480" y="421" font-family="Inter,Arial,sans-serif" font-size="28" fill="#166534" text-anchor="middle" font-weight="700">1.0104× throughput</text>
  <text x="1480" y="447" font-family="Inter,Arial,sans-serif" font-size="13" fill="#64748b" text-anchor="middle">peak -102.8 MB · equal reported loss</text>
  <rect x="1265" y="495" width="430" height="180" rx="10" fill="#eff6ff" stroke="#93c5fd"/>
  <text x="1480" y="530" font-family="Inter,Arial,sans-serif" font-size="17" fill="#1e40af" text-anchor="middle" font-weight="700">Qwen rocprofv3</text>
  <text x="1480" y="570" font-family="Inter,Arial,sans-serif" font-size="16" fill="#334155" text-anchor="middle">dispatches 7,624 → 7,192</text>
  <text x="1480" y="604" font-family="Inter,Arial,sans-serif" font-size="16" fill="#334155" text-anchor="middle">copy time 3.656 → 1.471 ms</text>
  <text x="1480" y="638" font-family="Inter,Arial,sans-serif" font-size="16" fill="#334155" text-anchor="middle">all Kernel 112.22 → 110.51 ms</text>

  <rect x="55" y="810" width="1690" height="78" rx="12" fill="#172033"/>
  <text x="900" y="843" font-family="Inter,Arial,sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">Keep: fewer layout copies and lower memory, with complete forward/backward alignment</text>
  <text x="900" y="871" font-family="Inter,Arial,sans-serif" font-size="14" fill="#cbd5e1" text-anchor="middle">The remaining Value/context transposes stay visible as the next falsifiable boundary</text>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0,0 L0,6 L7,3 z" fill="#64748b"/></marker></defs>
