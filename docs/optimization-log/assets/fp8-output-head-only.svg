<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="620" viewBox="0 0 1160 620" role="img" aria-labelledby="title desc">
  <title id="title">Output-head-only FP8 counterfactual</title>
  <desc id="desc">Output-head-only has zero aggregate Max and RMS change, small throughput costs, and a small DeepSeek scale-memory cost.</desc>
  <rect width="1160" height="620" rx="20" fill="#0b1020"/>
  <text x="56" y="58" fill="#f8fafc" font-size="29" font-family="sans-serif" font-weight="700">Output-head-only：代价很小，数值收益也是零</text>
  <text x="56" y="91" fill="#94a3b8" font-size="16" font-family="sans-serif">同revision device-Tensor control；不是旧host基线</text>
  <line x1="100" y1="270" x2="1060" y2="270" stroke="#64748b" stroke-width="2"/>
  <g fill="#22c55e"><rect x="150" y="269" width="130" height="2"/><rect x="390" y="269" width="130" height="2"/><rect x="650" y="269" width="130" height="2"/><rect x="890" y="269" width="130" height="2"/></g>
  <g fill="#f8fafc" font-size="15" font-family="sans-serif"><text x="174" y="245">Max Δ = 0</text><text x="414" y="245">RMS Δ = 0</text><text x="674" y="245">Max Δ = 0</text><text x="914" y="245">RMS Δ = 0</text></g>
  <g fill="#cbd5e1" font-size="16" font-family="sans-serif"><text x="190" y="315">Qwen</text><text x="710" y="315">DeepSeek</text></g>
  <rect x="120" y="390" width="420" height="120" rx="14" fill="#111827" stroke="#334155"/><text x="155" y="430" fill="#f8fafc" font-size="19" font-family="sans-serif">T512 TPS</text><text x="155" y="466" fill="#cbd5e1" font-size="17" font-family="sans-serif">Q -0.85% · Deep -0.52%（过门）</text>
  <rect x="620" y="390" width="420" height="120" rx="14" fill="#111827" stroke="#334155"/><text x="655" y="430" fill="#f8fafc" font-size="19" font-family="sans-serif">额外代价</text><text x="655" y="466" fill="#cbd5e1" font-size="17" font-family="sans-serif">Deep +607,740 B · 每forward 1次post</text>
  <text x="310" y="570" fill="#fbbf24" font-size="17" font-family="sans-serif">targeted keep=false：没有数值收益，删除scope</text>
</svg>
