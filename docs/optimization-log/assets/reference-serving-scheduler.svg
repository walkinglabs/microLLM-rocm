<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="790" viewBox="0 0 1800 790">
  <rect width="100%" height="100%" fill="#fbfcfe"/>
  <text x="900" y="48" font-family="Inter,Arial,sans-serif" font-size="30" fill="#172033" text-anchor="middle" font-weight="700">Experiment 072 · Reference Serving Scheduler</text>
  <text x="900" y="80" font-family="Inter,Arial,sans-serif" font-size="16" fill="#5b6474" text-anchor="middle">correctness-first · independent B=1 Cache per request · no cross-request batching</text>
  <rect x="70" y="125" width="820" height="510" fill="#fff" stroke="#cbd3df" rx="10"/>
  <text x="480" y="170" font-family="Inter,Arial,sans-serif" font-size="20" fill="#172033" text-anchor="middle" font-weight="700">State machine and delayed arrival</text>
  <g font-family="Inter,Arial,sans-serif" font-size="16" text-anchor="middle">
    <rect x="130" y="225" width="180" height="70" fill="#eef3ff" stroke="#9eb7e8" rx="8"/><text x="220" y="267" fill="#172033">submit request A</text>
    <rect x="355" y="225" width="180" height="70" fill="#fff7ed" stroke="#fdba74" rx="8"/><text x="445" y="255" fill="#172033">PendingPrefill</text><text x="445" y="278" fill="#5b6474">own KV Cache</text>
    <rect x="580" y="225" width="180" height="70" fill="#eefaf3" stroke="#9bd5b1" rx="8"/><text x="670" y="267" fill="#172033">Decoding</text>
    <path d="M310 260 H345" stroke="#5b6474" stroke-width="2" marker-end="url(#arrow)"/><path d="M535 260 H570" stroke="#5b6474" stroke-width="2" marker-end="url(#arrow)"/>
    <rect x="130" y="365" width="180" height="70" fill="#eef3ff" stroke="#9eb7e8" rx="8"/><text x="220" y="397" fill="#172033">request B arrives</text><text x="220" y="420" fill="#5b6474">after step 1</text>
    <rect x="355" y="365" width="180" height="70" fill="#fff7ed" stroke="#fdba74" rx="8"/><text x="445" y="397" fill="#172033">independent state</text><text x="445" y="420" fill="#5b6474">different length</text>
    <rect x="580" y="365" width="180" height="70" fill="#eefaf3" stroke="#9bd5b1" rx="8"/><text x="670" y="407" fill="#172033">Completed</text>
    <path d="M310 400 H345" stroke="#5b6474" stroke-width="2" marker-end="url(#arrow)"/><path d="M535 400 H570" stroke="#5b6474" stroke-width="2" marker-end="url(#arrow)"/>
  </g>
  <rect x="130" y="500" width="630" height="90" fill="#f5f7fa" stroke="#d8dee8" rx="8"/>
  <text x="445" y="535" font-family="Inter,Arial,sans-serif" font-size="16" fill="#172033" text-anchor="middle" font-weight="700">Gold behavior</text>
  <text x="445" y="566" font-family="Inter,Arial,sans-serif" font-size="15" fill="#5b6474" text-anchor="middle">generated tokens = independent generate() · request-local RNG · Cache released at completion</text>

  <rect x="930" y="125" width="800" height="510" fill="#fff" stroke="#cbd3df" rx="10"/>
  <text x="1330" y="170" font-family="Inter,Arial,sans-serif" font-size="20" fill="#172033" text-anchor="middle" font-weight="700">Tiny baseline throughput (token/s)</text>
  <line x1="1010" y1="520" x2="1660" y2="520" stroke="#cbd3df"/>
  <g font-family="Inter,Arial,sans-serif" font-size="13" text-anchor="middle">
    <rect x="1050" y="255" width="55" height="265" fill="#18a558"/><rect x="1110" y="278" width="55" height="242" fill="#6fa8dc"/><text x="1077" y="242" fill="#16874b">367</text><text x="1137" y="265" fill="#477aa8">331</text><text x="1107" y="550" fill="#172033">1 req</text>
    <rect x="1200" y="270" width="55" height="250" fill="#18a558"/><rect x="1260" y="278" width="55" height="242" fill="#6fa8dc"/><text x="1227" y="257" fill="#16874b">346</text><text x="1287" y="265" fill="#477aa8">331</text><text x="1257" y="550" fill="#172033">2 req</text>
    <rect x="1350" y="298" width="55" height="222" fill="#18a558"/><rect x="1410" y="279" width="55" height="241" fill="#6fa8dc"/><text x="1377" y="285" fill="#16874b">307</text><text x="1437" y="266" fill="#477aa8">331</text><text x="1407" y="550" fill="#172033">4 req</text>
    <rect x="1500" y="299" width="55" height="221" fill="#18a558"/><rect x="1560" y="278" width="55" height="242" fill="#6fa8dc"/><text x="1527" y="286" fill="#16874b">306</text><text x="1587" y="265" fill="#477aa8">331</text><text x="1557" y="550" fill="#172033">8 req</text>
  </g>
  <text x="1330" y="585" font-family="Inter,Arial,sans-serif" font-size="14" fill="#5b6474" text-anchor="middle">green CPU · blue HIP · scheduler ≈ sequential generate</text>
  <rect x="1000" y="600" width="660" height="30" fill="#fff0f0" stroke="#e6a2a0" rx="6"/>
  <text x="1330" y="621" font-family="Inter,Arial,sans-serif" font-size="14" fill="#b33b37" text-anchor="middle">batched forward calls = 0 · request throughput does not scale · optimization target is explicit</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#5b6474"/></marker></defs>
  <text x="900" y="705" font-family="Inter,Arial,sans-serif" font-size="18" fill="#9a4f00" text-anchor="middle" font-weight="700">Keep the reference semantics; the next node must batch slots without changing any request result</text>
</svg>
