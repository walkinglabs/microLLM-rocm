<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="580" viewBox="0 0 1120 580" role="img" aria-labelledby="title desc">
  <title id="title">Output-column native capability probe</title>
  <desc id="desc">The installed runtime rejects outer-vector weight scaling and uses native scalar FP8 GEMM followed by one device post-scale.</desc>
  <rect width="1120" height="580" rx="20" fill="#0b1020"/>
  <text x="56" y="58" fill="#f8fafc" font-size="29" font-family="sans-serif" font-weight="700">权重outer-vector能力：API存在，当前运行时拒绝</text>
  <text x="56" y="91" fill="#94a3b8" font-size="16" font-family="sans-serif">真实提交结果，不从头文件名称推断硬件支持</text>
  <rect x="70" y="160" width="250" height="100" rx="14" fill="#172554" stroke="#60a5fa"/><text x="105" y="202" fill="#f8fafc" font-size="19" font-family="sans-serif">提交 outer-vector</text><text x="127" y="231" fill="#93c5fd" font-size="16" font-family="sans-serif">A scale = N values</text>
  <path d="M320 210 H440" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="440" y="160" width="220" height="100" rx="14" fill="#3f1722" stroke="#fb7185"/><text x="485" y="202" fill="#f8fafc" font-size="20" font-family="sans-serif">status = 0</text><text x="475" y="231" fill="#fda4af" font-size="16" font-family="sans-serif">installed runtime拒绝</text>
  <path d="M660 210 H780" stroke="#94a3b8" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="780" y="135" width="275" height="150" rx="14" fill="#123127" stroke="#22c55e"/><text x="812" y="182" fill="#f8fafc" font-size="19" font-family="sans-serif">native scalar FP8 GEMM</text><text x="848" y="216" fill="#86efac" font-size="17" font-family="sans-serif">+ device post-scale</text><text x="826" y="250" fill="#cbd5e1" font-size="15" font-family="sans-serif">0 payload transfer · 0 GEMM fallback</text>
  <rect x="120" y="365" width="880" height="120" rx="14" fill="#111827" stroke="#334155"/><text x="160" y="407" fill="#f8fafc" font-size="20" font-family="sans-serif" font-weight="700">模型复核</text><text x="160" y="441" fill="#cbd5e1" font-size="17" font-family="sans-serif">Qwen：336 = 168 Linear × 2 forward</text><text x="575" y="441" fill="#cbd5e1" font-size="17" font-family="sans-serif">DeepSeek：394 = 197 × 2</text><text x="160" y="470" fill="#fbbf24" font-size="16" font-family="sans-serif">结论：直接库路径关闭；下一步做范围选择或Kernel融合</text>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#94a3b8"/></marker></defs>
</svg>
