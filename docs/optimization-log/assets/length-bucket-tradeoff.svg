<svg xmlns="http://www.w3.org/2000/svg" width="980" height="500" viewBox="0 0 980 500" role="img" aria-labelledby="title desc">
  <title id="title">Length bucket cache and latency tradeoff</title>
  <desc id="desc">Four metric ratios for Qwen and DeepSeek, with uniform cache equal to one hundred percent.</desc>
  <rect width="980" height="500" fill="#0b1020" rx="18"/>
  <text x="52" y="52" fill="#f8fafc" font-size="27" font-family="sans-serif" font-weight="700">四个 B2 长度桶相对统一 S8</text>
  <text x="52" y="82" fill="#94a3b8" font-size="16" font-family="sans-serif">低于 100%：更少/更快；高于 100%：更多/更慢</text>
  <line x1="310" y1="108" x2="310" y2="438" stroke="#64748b" stroke-width="2"/>
  <line x1="610" y1="108" x2="610" y2="438" stroke="#f8fafc" stroke-opacity="0.45" stroke-dasharray="6 6"/>
  <text x="592" y="102" fill="#cbd5e1" font-size="14" font-family="sans-serif">100%</text>
  <g font-family="sans-serif" font-size="17" fill="#e2e8f0">
    <text x="52" y="150">KV backing</text>
    <text x="52" y="230">TTFT p50</text>
    <text x="52" y="310">throughput</text>
    <text x="52" y="390">completion p50</text>
  </g>
  <g>
    <rect x="310" y="123" width="141" height="20" rx="5" fill="#22c55e"/><rect x="310" y="147" width="141" height="20" rx="5" fill="#38bdf8"/>
    <rect x="310" y="203" width="129" height="20" rx="5" fill="#22c55e"/><rect x="310" y="227" width="132" height="20" rx="5" fill="#38bdf8"/>
    <rect x="310" y="283" width="173" height="20" rx="5" fill="#22c55e"/><rect x="310" y="307" width="174" height="20" rx="5" fill="#38bdf8"/>
    <rect x="310" y="363" width="530" height="20" rx="5" fill="#22c55e"/><rect x="310" y="387" width="521" height="20" rx="5" fill="#38bdf8"/>
  </g>
  <g font-family="monospace" font-size="15" fill="#f8fafc">
    <text x="462" y="139">47.1%</text><text x="462" y="163">47.1%</text>
    <text x="450" y="219">43.0%</text><text x="453" y="243">43.9%</text>
    <text x="494" y="299">57.6%</text><text x="495" y="323">58.1%</text>
    <text x="850" y="379">176.3%</text><text x="841" y="403">173.6%</text>
  </g>
  <rect x="52" y="446" width="16" height="16" rx="3" fill="#22c55e"/><text x="78" y="460" fill="#cbd5e1" font-size="15" font-family="sans-serif">Qwen（前两行）</text>
  <rect x="235" y="446" width="16" height="16" rx="3" fill="#38bdf8"/><text x="261" y="460" fill="#cbd5e1" font-size="15" font-family="sans-serif">DeepSeek（前两行）</text>
  <text x="535" y="460" fill="#94a3b8" font-size="14" font-family="sans-serif">两模型 token exact；默认 policy 不改变</text>
</svg>
