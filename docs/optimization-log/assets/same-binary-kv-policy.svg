<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="790" viewBox="0 0 1800 790">
  <rect width="100%" height="100%" fill="#fbfcfe"/>
  <text x="900" y="48" font-family="Inter,Arial,sans-serif" font-size="30" fill="#172033" text-anchor="middle" font-weight="700">Experiment 069 · Same-Binary KV Policy Pairing</text>
  <text x="900" y="80" font-family="Inter,Arial,sans-serif" font-size="16" fill="#5b6474" text-anchor="middle">uniform BF16 ↔ layer-1 strict · alternating fresh processes · MI300X Release</text>
  <rect x="70" y="125" width="950" height="510" fill="#fff" stroke="#cbd3df" rx="10"/>
  <text x="545" y="170" font-family="Inter,Arial,sans-serif" font-size="20" fill="#172033" text-anchor="middle" font-weight="700">DeepSeek strict / uniform ratios</text>
  <line x1="145" y1="440" x2="950" y2="440" stroke="#8893a5" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="130" y="445" font-family="Inter,Arial,sans-serif" font-size="13" fill="#5b6474" text-anchor="end">1.00×</text>
  <g font-family="Inter,Arial,sans-serif" font-size="13" text-anchor="middle">
    <rect x="180" y="440" width="75" height="8" fill="#9aa4b2"/><text x="217" y="425" fill="#5b6474">0.996</text><text x="217" y="560" fill="#172033">T32 B1</text>
    <rect x="305" y="440" width="75" height="18" fill="#f2a65a"/><text x="342" y="425" fill="#9a4f00">0.991</text><text x="342" y="560" fill="#172033">T32 B8</text>
    <rect x="430" y="440" width="75" height="2" fill="#9aa4b2"/><text x="467" y="425" fill="#5b6474">0.999</text><text x="467" y="560" fill="#172033">T512 B1</text>
    <rect x="555" y="360" width="75" height="80" fill="#18a558"/><text x="592" y="345" fill="#16874b">1.040</text><text x="592" y="560" fill="#172033">T512 B8</text>
    <rect x="680" y="438" width="75" height="2" fill="#18a558"/><text x="717" y="425" fill="#16874b">1.001</text><text x="717" y="560" fill="#172033">T2K B1</text>
    <rect x="805" y="372" width="75" height="68" fill="#18a558"/><text x="842" y="357" fill="#16874b">1.034</text><text x="842" y="560" fill="#172033">T2K B8</text>
  </g>
  <rect x="145" y="585" width="805" height="32" fill="#eefaf3" stroke="#9bd5b1" rx="6"/>
  <text x="547" y="607" font-family="Inter,Arial,sans-serif" font-size="14" fill="#16874b" text-anchor="middle">DeepSeek steady decode: all six same-window ratios 0.991×–1.040×</text>

  <rect x="1060" y="125" width="670" height="510" fill="#fff" stroke="#cbd3df" rx="10"/>
  <text x="1395" y="170" font-family="Inter,Arial,sans-serif" font-size="20" fill="#172033" text-anchor="middle" font-weight="700">T2048 B8 attribution changes</text>
  <rect x="1110" y="215" width="570" height="120" fill="#fff0f0" stroke="#e6a2a0" rx="8"/>
  <text x="1140" y="251" font-family="Inter,Arial,sans-serif" font-size="16" fill="#b33b37" font-weight="700">Old cross-window comparison</text>
  <text x="1140" y="287" font-family="Inter,Arial,sans-serif" font-size="20" fill="#b33b37">DeepSeek E2E ratio 0.866×</text>
  <text x="1140" y="316" font-family="Inter,Arial,sans-serif" font-size="14" fill="#5b6474">different runs and GPU windows · invalid causal attribution</text>
  <rect x="1110" y="365" width="570" height="120" fill="#eefaf3" stroke="#9bd5b1" rx="8"/>
  <text x="1140" y="401" font-family="Inter,Arial,sans-serif" font-size="16" fill="#16874b" font-weight="700">Same binary, alternating order</text>
  <text x="1140" y="437" font-family="Inter,Arial,sans-serif" font-size="20" fill="#16874b">prepare 0.994× · E2E 1.011×</text>
  <text x="1140" y="466" font-family="Inter,Arial,sans-serif" font-size="14" fill="#5b6474">no measured long-batch penalty attributable to strict policy</text>
  <rect x="1110" y="520" width="570" height="80" fill="#f5f7fa" stroke="#d8dee8" rx="8"/>
  <text x="1140" y="552" font-family="Inter,Arial,sans-serif" font-size="15" fill="#172033" font-weight="700">What remains true</text>
  <text x="1140" y="581" font-family="Inter,Arial,sans-serif" font-size="14" fill="#172033">strict is checkpoint-specific and uses 3.57% more Cache than uniform</text>
  <text x="900" y="705" font-family="Inter,Arial,sans-serif" font-size="18" fill="#16874b" text-anchor="middle" font-weight="700">Keep the strict policy; reject the earlier cross-window performance penalty as an explanation</text>
</svg>
