<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="720" viewBox="0 0 1400 720">
  <rect width="1400" height="720" fill="#f8fafc"/>
  <text x="700" y="52" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="30" font-weight="700" fill="#111827">Experiment 084 · KV Cache per-row positions</text>
  <text x="700" y="82" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="15" fill="#64748b">Explicit divergent state first; model/kernel consumption comes next</text>

  <rect x="38" y="112" width="1324" height="354" rx="14" fill="#fff" stroke="#dbe4ee"/>
  <text x="62" y="152" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#111827">State transitions for B3</text>
  <g font-family="Inter,Arial,sans-serif" font-size="15" fill="#334155">
    <rect x="62" y="194" width="170" height="54" rx="8" fill="#dcfce7"/><text x="147" y="226" text-anchor="middle">[0, 0, 0]</text>
    <text x="250" y="226" font-size="22">→</text><text x="286" y="206" font-size="13">advance_row(0,2)</text>
    <rect x="286" y="194" width="170" height="54" rx="8" fill="#fef3c7"/><text x="371" y="226" text-anchor="middle">[2, 0, 0]</text>
    <text x="474" y="226" font-size="22">→</text><text x="510" y="206" font-size="13">reset_row(0)</text>
    <rect x="510" y="194" width="170" height="54" rx="8" fill="#dcfce7"/><text x="595" y="226" text-anchor="middle">[0, 0, 0]</text>
    <text x="698" y="226" font-size="22">→</text><text x="734" y="206" font-size="13">advance(3)</text>
    <rect x="734" y="194" width="170" height="54" rx="8" fill="#dcfce7"/><text x="819" y="226" text-anchor="middle">[3, 3, 3]</text>

    <rect x="286" y="316" width="170" height="54" rx="8" fill="#fef3c7"/><text x="371" y="348" text-anchor="middle">[3, 0, 3]</text>
    <text x="180" y="348" font-size="13">reset_row(1)</text><text x="250" y="348" font-size="22">←</text>
    <text x="474" y="348" font-size="22">→</text><text x="510" y="328" font-size="13">advance_row(1,3)</text>
    <rect x="510" y="316" width="170" height="54" rx="8" fill="#dcfce7"/><text x="595" y="348" text-anchor="middle">[3, 3, 3]</text>
  </g>
  <text x="980" y="214" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#166534">green: position() is valid</text>
  <text x="980" y="258" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#92400e">yellow: position() throws</text>
  <text x="980" y="316" font-family="Inter,Arial,sans-serif" font-size="14" fill="#64748b">No max/min fallback.</text>
  <text x="980" y="350" font-family="Inter,Arial,sans-serif" font-size="14" fill="#64748b">Ambiguity is visible.</text>
  <text x="62" y="430" font-family="Inter,Arial,sans-serif" font-size="14" fill="#64748b">Every advance is capacity checked. Full reset restores [0,0,0].</text>

  <rect x="38" y="496" width="642" height="154" rx="14" fill="#fff" stroke="#dbe4ee"/>
  <text x="62" y="536" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#111827">Storage + metadata</text>
  <g font-family="Inter,Arial,sans-serif" font-size="15" fill="#334155">
    <circle cx="76" cy="582" r="6" fill="#16a34a"/><text x="96" y="588">reset_row clears full K/V capacity</text>
    <circle cx="76" cy="620" r="6" fill="#16a34a"/><text x="96" y="626">row position becomes 0; other positions unchanged</text>
  </g>

  <rect x="714" y="496" width="648" height="154" rx="14" fill="#fff" stroke="#dbe4ee"/>
  <text x="738" y="536" font-family="Inter,Arial,sans-serif" font-size="20" font-weight="700" fill="#111827">Current safety boundary</text>
  <g font-family="Inter,Arial,sans-serif" font-size="15" fill="#334155">
    <circle cx="752" cy="582" r="6" fill="#16a34a"/><text x="772" y="588">uniform legacy forward remains unchanged</text>
    <circle cx="752" cy="620" r="6" fill="#f59e0b"/><text x="772" y="626">divergent model forward intentionally rejects</text>
  </g>
  <rect x="38" y="674" width="1324" height="30" rx="10" fill="#fef3c7" stroke="#fde68a"/>
  <text x="700" y="695" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="16" font-weight="700" fill="#92400e">Next: RoPE + KV store + cached Attention consume positions[B]</text>
</svg>
