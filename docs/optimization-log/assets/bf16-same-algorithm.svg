<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="500" viewBox="0 0 1080 500" role="img" aria-labelledby="t d"><title id="t">Same BF16 algorithm</title><desc id="d">Common solution removes all drift with a small throughput cost.</desc><rect width="1080" height="500" fill="#0b1020"/><text x="48" y="58" fill="#f8fafc" font-family="sans-serif" font-size="30" font-weight="700">Common solution 75892</text><rect x="70" y="130" width="410" height="70" rx="10" fill="#3b1720"/><text x="95" y="172" fill="#fecaca" font-family="sans-serif" font-size="20">default logits max drift 0.153016</text><path d="M500 165 L590 165" stroke="#f8fafc" stroke-width="4"/><rect x="610" y="130" width="390" height="70" rx="10" fill="#173421"/><text x="650" y="172" fill="#bbf7d0" font-family="sans-serif" font-size="20">same algorithm: 48/48 exact</text><text x="80" y="285" fill="#e2e8f0" font-family="sans-serif" font-size="18">B1 throughput</text><rect x="250" y="260" width="481" height="32" fill="#38bdf8"/><text x="750" y="284" fill="#bae6fd" font-family="sans-serif" font-size="16">96.23%</text><text x="80" y="355" fill="#e2e8f0" font-family="sans-serif" font-size="18">B2 throughput</text><rect x="250" y="330" width="494" height="32" fill="#8b5cf6"/><text x="763" y="354" fill="#ddd6fe" font-family="sans-serif" font-size="16">98.73%</text><rect x="48" y="420" width="984" height="44" rx="8" fill="#3b2a14"/><text x="72" y="448" fill="#fde68a" font-family="sans-serif" font-size="16">Version-local opt-in; default dispatch unchanged.</text></svg>
