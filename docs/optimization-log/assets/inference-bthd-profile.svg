<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Post-BTHD Kernel time and remaining categories</title>
  <desc id="desc">Strided materialization disappears and total Kernel time improves, leaving GEMM, cast and softmax.</desc>
  <rect width="1000" height="560" fill="#0b1020"/>
