  <text x="55" y="140" fill="#e2e8f0" font-family="sans-serif" font-size="20" font-weight="700">Total Kernel time</text>
  <text x="55" y="185" fill="#cbd5e1" font-family="sans-serif" font-size="15">Qwen pre-BTHD</text>
  <rect x="250" y="162" width="426" height="31" rx="6" fill="#fb7185"/>
  <text x="690" y="184" fill="#fecdd3" font-family="monospace" font-size="14">5.680 ms</text>
  <text x="55" y="230" fill="#cbd5e1" font-family="sans-serif" font-size="15">Qwen BTHD</text>
  <rect x="250" y="207" width="364" height="31" rx="6" fill="#34d399"/>
  <text x="628" y="229" fill="#a7f3d0" font-family="monospace" font-size="14">4.858 ms</text>
  <text x="55" y="285" fill="#cbd5e1" font-family="sans-serif" font-size="15">DeepSeek pre-BTHD</text>
  <rect x="250" y="262" width="762" height="31" rx="6" fill="#fb7185"/>
  <text x="888" y="284" fill="#fecdd3" font-family="monospace" font-size="14">10.160 ms</text>
