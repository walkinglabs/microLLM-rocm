<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="570" viewBox="0 0 1040 570" role="img" aria-labelledby="title desc">
  <title id="title">Shared FP8 activation quantization speedup</title><desc id="desc">Reusing quantized QKV and gate-up inputs improves T512 throughput without changing complete logits errors.</desc>
  <rect width="1040" height="570" rx="18" fill="#0b1020"/><text x="52" y="52" fill="#f8fafc" font-size="28" font-family="sans-serif" font-weight="700">共享动态量化：调用少43%，T512再快12%</text>
  <text x="52" y="82" fill="#94a3b8" font-size="16" font-family="sans-serif">蓝=Exp133；绿=shared；虚线=同轮BF16</text>
  <line x1="80" y1="450" x2="960" y2="450" stroke="#334155"/><line x1="80" y1="170" x2="960" y2="170" stroke="#fbbf24" stroke-dasharray="10 8"/>
  <rect x="150" y="238" width="130" height="212" fill="#38bdf8"/><rect x="295" y="211" width="130" height="239" fill="#22c55e"/><rect x="620" y="323" width="130" height="127" fill="#38bdf8"/><rect x="765" y="307" width="130" height="143" fill="#22c55e"/>
  <g fill="#f8fafc" font-family="sans-serif" font-size="15"><text x="150" y="228">Q 75518</text><text x="295" y="201">Q 85193</text><text x="620" y="313">D 44975</text><text x="765" y="297">D 50546</text></g>
  <g fill="#cbd5e1" font-family="sans-serif" font-size="15"><text x="170" y="500">Q calls 168→96 · +12.81%</text><text x="625" y="500">D 197→113 · +12.39%</text><text x="170" y="545">Deep=1.028× BF16；完整FP8精度门仍失败</text></g>
</svg>
