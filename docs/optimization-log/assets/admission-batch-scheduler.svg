<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="790" viewBox="0 0 1800 790">
  <rect width="100%" height="100%" fill="#fbfcfe"/>
  <text x="900" y="48" font-family="Inter,Arial,sans-serif" font-size="30" fill="#172033" text-anchor="middle" font-weight="700">Experiment 074 · Admission Batch Scheduler</text>
  <text x="900" y="80" font-family="Inter,Arial,sans-serif" font-size="16" fill="#5b6474" text-anchor="middle">stable compatibility buckets · singleton fallback · CPU/HIP · three-process median</text>
  <rect x="70" y="125" width="980" height="510" fill="#fff" stroke="#cbd3df" rx="10"/>
  <text x="560" y="170" font-family="Inter,Arial,sans-serif" font-size="20" fill="#172033" text-anchor="middle" font-weight="700">HIP throughput plateaus at the bucket size</text>
  <line x1="145" y1="530" x2="990" y2="530" stroke="#cbd3df"/>
  <g font-family="Inter,Arial,sans-serif" font-size="13" text-anchor="middle">
    <rect x="175" y="430" width="90" height="100" fill="#18a558"/><text x="220" y="417" fill="#16874b">336</text><text x="220" y="560" fill="#172033">1 req</text><text x="220" y="585" fill="#5b6474">1×B1</text>
    <rect x="335" y="335" width="90" height="195" fill="#18a558"/><text x="380" y="322" fill="#16874b">655</text><text x="380" y="560" fill="#172033">2 req</text><text x="380" y="585" fill="#5b6474">1×B2</text>
    <rect x="495" y="155" width="90" height="375" fill="#18a558"/><text x="540" y="142" fill="#16874b">1260</text><text x="540" y="560" fill="#172033">4 req</text><text x="540" y="585" fill="#5b6474">1×B4</text>
    <rect x="655" y="157" width="90" height="373" fill="#6fa8dc"/><text x="700" y="144" fill="#477aa8">1253</text><text x="700" y="560" fill="#172033">8 req</text><text x="700" y="585" fill="#5b6474">2×B4</text>
    <rect x="815" y="155" width="90" height="375" fill="#6fa8dc"/><text x="860" y="142" fill="#477aa8">1259</text><text x="860" y="560" fill="#172033">16 req</text><text x="860" y="585" fill="#5b6474">4×B4</text>
  </g>
  <line x1="135" y1="430" x2="940" y2="430" stroke="#9aa4b2" stroke-width="2" stroke-dasharray="7 6"/>
  <text x="930" y="417" font-family="Inter,Arial,sans-serif" font-size="13" fill="#5b6474" text-anchor="end">serial ≈333 tok/s</text>

  <rect x="1090" y="125" width="640" height="510" fill="#fff" stroke="#cbd3df" rx="10"/>
  <text x="1410" y="170" font-family="Inter,Arial,sans-serif" font-size="20" fill="#172033" text-anchor="middle" font-weight="700">What admission bucketing proves</text>
  <rect x="1140" y="215" width="540" height="100" fill="#eefaf3" stroke="#9bd5b1" rx="8"/>
  <text x="1170" y="250" font-family="Inter,Arial,sans-serif" font-size="16" fill="#16874b" font-weight="700">Correct grouping</text>
  <text x="1170" y="282" font-family="Inter,Arial,sans-serif" font-size="15" fill="#172033">30/30 process outputs match reference</text>
  <rect x="1140" y="345" width="540" height="100" fill="#f5f7fa" stroke="#d8dee8" rx="8"/>
  <text x="1170" y="380" font-family="Inter,Arial,sans-serif" font-size="16" fill="#172033" font-weight="700">Stable compatibility key</text>
  <text x="1170" y="412" font-family="Inter,Arial,sans-serif" font-size="14" fill="#5b6474">length · generation config · seed · cache policy</text>
  <rect x="1140" y="475" width="540" height="110" fill="#fff7ed" stroke="#fdba74" rx="8"/>
  <text x="1170" y="510" font-family="Inter,Arial,sans-serif" font-size="16" fill="#9a4f00" font-weight="700">Why throughput stops scaling</text>
  <text x="1170" y="542" font-family="Inter,Arial,sans-serif" font-size="14" fill="#172033">groups execute serially after admission</text>
  <text x="1170" y="568" font-family="Inter,Arial,sans-serif" font-size="14" fill="#172033">no active-slot refill across groups</text>
  <text x="900" y="705" font-family="Inter,Arial,sans-serif" font-size="18" fill="#9a4f00" text-anchor="middle" font-weight="700">Keep admission bucketing; the next throughput step requires token-level slot refill, not larger queues</text>
</svg>
