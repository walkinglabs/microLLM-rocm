<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="570" viewBox="0 0 1040 570" role="img" aria-labelledby="title desc">
  <title id="title">Residual cancellation factors</title><desc id="desc">Near-opposite residual and FFN vectors amplify relative FP8 error at selected blocks.</desc>
  <rect width="1040" height="570" rx="18" fill="#0b1020"/><text x="52" y="52" fill="#f8fafc" font-size="28" font-family="sans-serif" font-weight="700">残差抵消已证明：Qwen达到17倍</text>
  <text x="52" y="82" fill="#94a3b8" font-size="16" font-family="sans-serif">蓝=误差分子增加；红=参考分母收缩；绿=总relative-error放大</text>
  <line x1="80" y1="450" x2="960" y2="450" stroke="#334155"/>
  <rect x="130" y="420" width="90" height="30" fill="#38bdf8"/><rect x="230" y="282" width="90" height="168" fill="#fb7185"/><rect x="330" y="207" width="90" height="243" fill="#22c55e"/><rect x="620" y="418" width="90" height="32" fill="#38bdf8"/><rect x="720" y="404" width="90" height="46" fill="#fb7185"/><rect x="820" y="379" width="90" height="71" fill="#22c55e"/>
  <g fill="#f8fafc" font-family="sans-serif" font-size="14"><text x="130" y="410">Q 1.45×</text><text x="230" y="272">8.38×</text><text x="330" y="197">12.17×</text><text x="620" y="408">D 1.55×</text><text x="720" y="394">2.30×</text><text x="820" y="369">3.55×</text></g>
  <g fill="#cbd5e1" font-family="sans-serif" font-size="15"><text x="140" y="500">Q cos=-0.9935 · cancellation=17.02×</text><text x="600" y="500">Deep cos=-0.9010 · 4.45×</text><text x="195" y="545">证明几何放大；仍需mixed FP32 block判断可修复因果</text></g>
</svg>
