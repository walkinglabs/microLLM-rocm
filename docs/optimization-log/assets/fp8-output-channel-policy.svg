<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="680" viewBox="0 0 1160 680" role="img" aria-labelledby="title desc">
  <title id="title">FP8 output-channel model policy</title>
  <desc id="desc">Output-channel scaling worsens Qwen RMS, improves DeepSeek RMS, and reduces T512 throughput for both models.</desc>
  <rect width="1160" height="680" rx="20" fill="#0b1020"/>
  <text x="56" y="58" fill="#f8fafc" font-size="29" font-family="sans-serif" font-weight="700">每列一把尺子：DeepSeek变准，Qwen变差</text>
  <text x="56" y="91" fill="#94a3b8" font-size="16" font-family="sans-serif">上图=RMS相对旧策略变化；下图=T512吞吐变化。绿色改善，红色退化。</text>
  <line x1="100" y1="300" x2="1070" y2="300" stroke="#64748b" stroke-width="2"/>
  <rect x="150" y="212" width="130" height="88" fill="#fb7185"/><rect x="390" y="215" width="130" height="85" fill="#fb7185"/>
  <rect x="650" y="300" width="130" height="180" fill="#22c55e"/><rect x="890" y="300" width="130" height="102" fill="#22c55e"/>
  <g fill="#f8fafc" font-size="15" font-family="sans-serif"><text x="170" y="201">Q T8 +28.8%</text><text x="404" y="204">Q T512 +27.8%</text><text x="657" y="505">Deep T8 -59.0%</text><text x="892" y="427">Deep T512 -33.5%</text></g>
  <line x1="100" y1="590" x2="1070" y2="590" stroke="#64748b" stroke-width="2"/>
  <rect x="390" y="505" width="130" height="85" fill="#fb7185"/><rect x="890" y="506" width="130" height="84" fill="#fb7185"/>
  <text x="395" y="495" fill="#f8fafc" font-size="15" font-family="sans-serif">Q TPS -13.09%</text><text x="895" y="496" fill="#f8fafc" font-size="15" font-family="sans-serif">Deep TPS -12.86%</text>
  <g fill="#cbd5e1" font-size="15" font-family="sans-serif"><text x="182" y="625">Q T8</text><text x="412" y="625">Q T512</text><text x="674" y="625">Deep T8</text><text x="904" y="625">Deep T512</text></g>
  <text x="285" y="660" fill="#fbbf24" font-size="16" font-family="sans-serif">0/4精度门，0/2长上下文速度门：拒绝默认，保留定向实验</text>
</svg>
