  <rect x="55" y="825" width="1690" height="66" rx="12" fill="#172033"/>
  <text x="900" y="854" font-family="Inter,Arial,sans-serif" font-size="18" fill="#ffffff" text-anchor="middle" font-weight="700">Next node: cache descriptor/layout state, then demand both-model ≥1.01×</text>
