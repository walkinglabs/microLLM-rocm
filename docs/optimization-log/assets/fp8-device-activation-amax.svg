<svg xmlns="http://www.w3.org/2000/svg" width="1040" height="600" viewBox="0 0 1040 600" role="img" aria-labelledby="title desc">
  <title id="title">Official device activation Tensor amax accuracy and speed</title><desc id="desc">Dynamic activation scales reduce RMS substantially while single-block reduction destroys long-context throughput.</desc>
  <rect width="1040" height="600" rx="18" fill="#0b1020"/>
  <text x="52" y="52" fill="#f8fafc" font-size="28" font-family="sans-serif" font-weight="700">device activation amax：数值改善，长context性能失败</text>
  <text x="52" y="82" fill="#94a3b8" font-size="16" font-family="sans-serif">绿=RMS相对Exp127剩余比例；红=FP8/BF16吞吐比例</text>
  <g font-family="sans-serif" font-size="17" fill="#e2e8f0"><text x="95" y="145">Qwen T8</text><text x="325" y="145">Qwen T512</text><text x="555" y="145">Deep T8</text><text x="785" y="145">Deep T512</text></g>
  <line x1="70" y1="470" x2="970" y2="470" stroke="#334155"/><line x1="70" y1="170" x2="970" y2="170" stroke="#334155"/>
  <g><rect x="105" y="383" width="70" height="87" fill="#22c55e"/><rect x="180" y="282" width="70" height="188" fill="#fb7185"/><rect x="335" y="402" width="70" height="68" fill="#22c55e"/><rect x="410" y="454" width="70" height="16" fill="#fb7185"/><rect x="565" y="358" width="70" height="112" fill="#22c55e"/><rect x="640" y="286" width="70" height="184" fill="#fb7185"/><rect x="795" y="413" width="70" height="57" fill="#22c55e"/><rect x="870" y="457" width="70" height="13" fill="#fb7185"/></g>
  <g fill="#f8fafc" font-size="14" font-family="sans-serif"><text x="105" y="375">RMS 29%</text><text x="178" y="274">speed 62.7%</text><text x="335" y="394">RMS 22.5%</text><text x="402" y="446">speed 5.27%</text><text x="565" y="350">RMS 37.3%</text><text x="638" y="278">speed 61.4%</text><text x="795" y="405">RMS 19.0%</text><text x="862" y="449">speed 4.40%</text></g>
  <g fill="#cbd5e1" font-size="15" font-family="sans-serif"><text x="120" y="520">四个top token保持，但四个完整logits门仍失败</text><text x="120" y="550">T512 one-block amax：Qwen慢约19×，DeepSeek慢约23×</text><text x="120" y="580">保留device-scale地基；拒绝当前粒度与reduction Kernel</text></g>
</svg>
