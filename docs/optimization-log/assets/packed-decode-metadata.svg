<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="600" viewBox="0 0 1080 600" role="img" aria-labelledby="title desc">
  <title id="title">Packed decode metadata reduces H2D calls</title>
  <desc id="desc">Token, position and cache row arrays are packed into one transfer. Alternating performance remains positive.</desc>
  <rect width="1080" height="600" fill="#0b1020"/>
  <text x="40" y="44" fill="#f8fafc" font-family="sans-serif" font-size="24" font-weight="700">Experiment 100 · three tiny uploads become one</text>
  <text x="40" y="72" fill="#94a3b8" font-family="sans-serif" font-size="14">Same 596 bytes · fewer API boundaries · exact outputs</text>

  <rect x="40" y="108" width="1000" height="190" rx="12" fill="#111827" stroke="#334155"/>
  <text x="64" y="142" fill="#e2e8f0" font-family="sans-serif" font-size="17" font-weight="700">Per positions-aware step</text>
  <rect x="90" y="170" width="180" height="48" rx="7" fill="#172554" stroke="#3b82f6"/><text x="180" y="199" text-anchor="middle" fill="#dbeafe" font-family="sans-serif" font-size="14">token IDs [A]</text>
  <rect x="300" y="170" width="180" height="48" rx="7" fill="#713f12" stroke="#f59e0b"/><text x="390" y="199" text-anchor="middle" fill="#fef3c7" font-family="sans-serif" font-size="14">positions [A]</text>
  <rect x="510" y="170" width="180" height="48" rx="7" fill="#3f1d5e" stroke="#a855f7"/><text x="600" y="199" text-anchor="middle" fill="#f3e8ff" font-family="sans-serif" font-size="14">cache rows [A]</text>
  <path d="M710 194 H770" stroke="#22c55e" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="784" y="158" width="210" height="72" rx="8" fill="#14532d" stroke="#22c55e"/><text x="889" y="186" text-anchor="middle" fill="#dcfce7" font-family="sans-serif" font-size="14">packed [3,A]</text><text x="889" y="210" text-anchor="middle" fill="#bbf7d0" font-family="sans-serif" font-size="13">one H2D · three views</text>
  <text x="90" y="258" fill="#93c5fd" font-family="sans-serif" font-size="14">R8/S4 32→16 calls · R8/S2 56→24 calls · bytes remain 596</text>

  <rect x="40" y="332" width="1000" height="210" rx="12" fill="#111827" stroke="#334155"/>
  <text x="64" y="368" fill="#e2e8f0" font-family="sans-serif" font-size="17" font-weight="700">Alternating Release candidate / baseline</text>
  <line x1="130" y1="492" x2="950" y2="492" stroke="#64748b"/><line x1="130" y1="456" x2="950" y2="456" stroke="#f59e0b" stroke-dasharray="8 8"/><text x="92" y="461" fill="#fbbf24" font-family="sans-serif" font-size="13">1×</text>
  <rect x="270" y="444" width="180" height="48" fill="#22c55e"/><text x="360" y="434" text-anchor="middle" fill="#bbf7d0" font-family="sans-serif" font-size="15">1.033×</text><text x="360" y="520" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">R8/S4</text>
  <rect x="630" y="430" width="180" height="62" fill="#22c55e"/><text x="720" y="420" text-anchor="middle" fill="#bbf7d0" font-family="sans-serif" font-size="15">1.065×</text><text x="720" y="520" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="13">R8/S2</text>
  <text x="40" y="578" fill="#94a3b8" font-family="sans-serif" font-size="13">6/6 pairs faster · D2H/D2D/Cache unchanged · device-token fallback retained</text>
  <defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8 Z" fill="#22c55e"/></marker></defs>
</svg>
