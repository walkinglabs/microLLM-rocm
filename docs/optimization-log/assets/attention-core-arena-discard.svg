<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="570" viewBox="0 0 1000 570" role="img" aria-labelledby="title desc">
  <title id="title">Attention core Arena model rejection</title>
  <desc id="desc">Both eligible T512 ratios stay below the 1.01 keep line despite large allocation reductions.</desc>
  <rect width="1000" height="570" fill="#0b1020"/>
  <text x="48" y="48" fill="#f8fafc" font-family="sans-serif" font-size="25" font-weight="700">The largest allocation source still is not the bottleneck</text>
  <text x="48" y="76" fill="#94a3b8" font-family="sans-serif" font-size="14">60 fresh processes · complete logits exact · core Arena / retained FFN baseline</text>
  <line x1="100" y1="360" x2="900" y2="360" stroke="#64748b" stroke-dasharray="3 4"/>
  <text x="905" y="365" fill="#cbd5e1" font-family="sans-serif" font-size="12">1.00×</text>
  <line x1="100" y1="190" x2="900" y2="190" stroke="#f59e0b" stroke-dasharray="5 5"/>
  <text x="905" y="195" fill="#fcd34d" font-family="sans-serif" font-size="12">1.01× keep</text>
  <rect x="230" y="300" width="180" height="60" rx="7" fill="#38bdf8"/>
  <text x="320" y="287" text-anchor="middle" fill="#7dd3fc" font-family="sans-serif" font-size="18">1.004×</text>
  <rect x="590" y="331" width="180" height="29" rx="7" fill="#22c55e"/>
  <text x="680" y="318" text-anchor="middle" fill="#86efac" font-family="sans-serif" font-size="18">1.002×</text>
  <text x="320" y="395" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="16">Qwen T512</text>
  <text x="680" y="395" text-anchor="middle" fill="#cbd5e1" font-family="sans-serif" font-size="16">DeepSeek T512</text>
  <rect x="100" y="440" width="800" height="82" rx="8" fill="#111827" stroke="#334155"/>
  <text x="500" y="470" text-anchor="middle" fill="#e2e8f0" font-family="sans-serif" font-size="14">allocations: 2895→2295 / 3375→2675 · backing: 20.19 / 22.02 MB</text>
  <text x="500" y="498" text-anchor="middle" fill="#fda4af" font-family="sans-serif" font-size="14">both miss 1.01 · persistent Storage track saturated · move to device math</text>
</svg>
