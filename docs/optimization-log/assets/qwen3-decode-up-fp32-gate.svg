  <text x="1235" y="183" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#92400e">Memory tradeoff</text>
  <text x="1235" y="248" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="43" font-weight="700" fill="#92400e">+336 MiB</text>
  <text x="1235" y="282" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#5b6474">resident weights</text>
  <text x="1235" y="326" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="700" fill="#166534">+0 incremental peak</text>
  <text x="1235" y="354" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#5b6474">all five measured cases</text>

