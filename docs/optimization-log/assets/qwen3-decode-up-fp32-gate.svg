  <text x="265" y="326" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#b45309">strict logits 7 / 8</text>
  <text x="265" y="354" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#5b6474">T128/B1 common-FP32 boundary retained</text>

  <rect x="540" y="135" width="420" height="245" rx="20" fill="#ffffff" stroke="#2563eb" stroke-width="3"/>
  <text x="750" y="183" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="23" font-weight="700" fill="#1d4ed8">Performance gate</text>
  <text x="750" y="248" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="48" font-weight="700" fill="#166534">10 / 10</text>
  <text x="750" y="282" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="17" fill="#5b6474">two matrices · case gates pass</text>
  <text x="750" y="326" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="25" font-weight="700" fill="#172033">geo 0.97984× / 0.98178×</text>
  <text x="750" y="354" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="14" fill="#5b6474">fixed gate ≥ 0.97</text>

