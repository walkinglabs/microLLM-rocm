  <rect x="250" y="536" width="390" height="18" rx="9" fill="#2563eb"/><text x="655" y="550" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">0.9707</text>
  <text x="85" y="580" font-family="Inter,Arial,sans-serif" font-size="14" fill="#5b6474">T128 decode</text>
  <rect x="250" y="566" width="545" height="18" rx="9" fill="#2563eb"/><text x="810" y="580" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="700" fill="#1d4ed8">0.9790</text>
