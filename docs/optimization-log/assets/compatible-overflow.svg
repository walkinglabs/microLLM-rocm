<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Compatible overflow recovers short-heavy tail latency</title>
  <desc id="desc">Uniform fixed bucket and compatible overflow throughput and tail latency for short-heavy traffic.</desc>
  <rect width="1000" height="560" rx="18" fill="#0b1020"/>
  <text x="52" y="52" fill="#f8fafc" font-size="28" font-family="sans-serif" font-weight="700">short-heavy：Uniform / Fixed / Overflow</text>
  <text x="52" y="82" fill="#94a3b8" font-size="16" font-family="sans-serif">Qwen与DeepSeek比例接近；Fixed=100%</text>
  <line x1="300" y1="112" x2="300" y2="455" stroke="#64748b" stroke-width="2"/>
  <line x1="500" y1="112" x2="500" y2="455" stroke="#f8fafc" stroke-opacity="0.45" stroke-dasharray="6 6"/>
  <text x="482" y="106" fill="#cbd5e1" font-size="14" font-family="sans-serif">100%</text>
  <g font-family="sans-serif" font-size="18" fill="#e2e8f0">
    <text x="52" y="178">throughput</text><text x="52" y="298">TTFT P95</text><text x="52" y="418">completion P95</text>
  </g>
  <g>
    <rect x="300" y="128" width="274" height="24" rx="5" fill="#a78bfa"/><rect x="300" y="158" width="200" height="24" rx="5" fill="#fb7185"/><rect x="300" y="188" width="226" height="24" rx="5" fill="#22c55e"/>
    <rect x="300" y="248" width="62" height="24" rx="5" fill="#a78bfa"/><rect x="300" y="278" width="200" height="24" rx="5" fill="#fb7185"/><rect x="300" y="308" width="77" height="24" rx="5" fill="#22c55e"/>
    <rect x="300" y="368" width="89" height="24" rx="5" fill="#a78bfa"/><rect x="300" y="398" width="200" height="24" rx="5" fill="#fb7185"/><rect x="300" y="428" width="120" height="24" rx="5" fill="#22c55e"/>
  </g>
  <g font-family="monospace" font-size="15" fill="#f8fafc">
    <text x="582" y="146">U 137%</text><text x="508" y="176">F 100%</text><text x="534" y="206">O 113%</text>
    <text x="370" y="266">U 31%</text><text x="508" y="296">F 100%</text><text x="385" y="326">O 38%</text>
    <text x="397" y="386">U 44%</text><text x="508" y="416">F 100%</text><text x="428" y="446">O 60%</text>
  </g>
  <g font-family="sans-serif" font-size="15" fill="#cbd5e1">
    <rect x="135" y="500" width="16" height="16" rx="3" fill="#a78bfa"/><text x="161" y="514">Uniform</text>
    <rect x="315" y="500" width="16" height="16" rx="3" fill="#fb7185"/><text x="341" y="514">Fixed B4×2</text>
    <rect x="520" y="500" width="16" height="16" rx="3" fill="#22c55e"/><text x="546" y="514">Compatible overflow</text>
    <text x="760" y="514" fill="#94a3b8">修复明显，但未追平uniform</text>
  </g>
</svg>
