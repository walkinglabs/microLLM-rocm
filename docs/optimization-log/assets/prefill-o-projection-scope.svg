<svg xmlns="http://www.w3.org/2000/svg" width="1420" height="560" viewBox="0 0 1420 560">
  <rect width="1420" height="560" fill="#0b1020"/>
  <style>text{font-family:ui-monospace,SFMono-Regular,monospace;fill:#e5e7eb}.title{font-size:25px;font-weight:700}.sub{font-size:12px;fill:#94a3b8}.head{font-size:15px;font-weight:700}.small{font-size:11px;fill:#94a3b8}</style>
  <text x="38" y="44" class="title">Scoped cached-prefill O projection</text>
  <text x="38" y="70" class="sub">same M/K/N as Q projection · different ownership · zero default entries</text>
  <rect x="80" y="130" width="330" height="110" rx="12" fill="#131b2e" stroke="#38bdf8"/><text x="245" y="168" class="head" text-anchor="middle">Q projection</text><text x="245" y="198" class="small" text-anchor="middle">PrefillQueryProjection · 296100</text><text x="245" y="220" class="small" text-anchor="middle">cannot hit O</text>
  <rect x="545" y="130" width="330" height="110" rx="12" fill="#131b2e" stroke="#22c55e"/><text x="710" y="168" class="head" text-anchor="middle">O projection</text><text x="710" y="198" class="small" text-anchor="middle">PrefillAttentionOutputProjection</text><text x="710" y="220" class="small" text-anchor="middle">explicit 296100 only</text>
  <rect x="1010" y="130" width="330" height="110" rx="12" fill="#131b2e" stroke="#64748b"/><text x="1175" y="168" class="head" text-anchor="middle">FFN / train / decode</text><text x="1175" y="198" class="small" text-anchor="middle">other scopes or General</text><text x="1175" y="220" class="small" text-anchor="middle">no accidental hit</text>
  <text x="80" y="325" class="head">B1T2048 pilot</text>
  <line x1="120" y1="390" x2="1300" y2="390" stroke="#334155" stroke-width="4"/><circle cx="260" cy="390" r="12" fill="#22c55e"/><text x="260" y="428" class="small" text-anchor="middle">5 entries</text><circle cx="520" cy="390" r="12" fill="#22c55e"/><text x="520" y="428" class="small" text-anchor="middle">5 misses</text><circle cx="780" cy="390" r="12" fill="#22c55e"/><text x="780" y="428" class="small" text-anchor="middle">163 cache hits</text><circle cx="1040" cy="390" r="12" fill="#22c55e"/><text x="1040" y="428" class="small" text-anchor="middle">168 registry hits</text><circle cx="1300" cy="390" r="12" fill="#22c55e"/><text x="1300" y="428" class="small" text-anchor="middle">168 dispatches</text>
  <rect x="80" y="485" width="1260" height="45" rx="9" fill="#111827" stroke="#334155"/><text x="110" y="513" class="sub">Pilot proves routing only. Trace, complete logits and end-to-end gates still decide acceptance.</text>
</svg>
