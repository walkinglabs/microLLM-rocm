  <text x="1268" y="678" font-family="Inter,Arial,sans-serif" font-size="14" fill="#475569" text-anchor="middle">Qwen speed fails · DeepSeek parameter guard fails</text>

  <rect x="55" y="825" width="1690" height="66" rx="12" fill="#172033"/>
