<text x="130" y="365" text-anchor="middle" fill="#cbd5e8" font-family="sans-serif" font-size="13">run-1</text>
<text x="130" y="388" text-anchor="middle" fill="#80ed99" font-family="sans-serif" font-size="12">copied: 0 B</text>
<rect x="280" y="174.2" width="70" height="165.8" fill="#4cc9f0" rx="3"/>
<text x="315" y="164.2" text-anchor="middle" fill="#f4f7ff" font-family="sans-serif" font-size="12">48.0</text>
<text x="315" y="365" text-anchor="middle" fill="#cbd5e8" font-family="sans-serif" font-size="13">run-2</text>
<text x="315" y="388" text-anchor="middle" fill="#80ed99" font-family="sans-serif" font-size="12">copied: 0 B</text>
<rect x="465" y="174.2" width="70" height="165.8" fill="#4cc9f0" rx="3"/>
<text x="500" y="164.2" text-anchor="middle" fill="#f4f7ff" font-family="sans-serif" font-size="12">48.0</text>
<text x="500" y="365" text-anchor="middle" fill="#cbd5e8" font-family="sans-serif" font-size="13">run-3</text>
<text x="500" y="388" text-anchor="middle" fill="#80ed99" font-family="sans-serif" font-size="12">copied: 0 B</text>
<text x="720" y="115" fill="#f4f7ff" font-family="sans-serif" font-size="16">Gates</text>
<text x="720" y="150" fill="#80ed99" font-family="sans-serif" font-size="13">✓ pointer identity 3/3</text>
<text x="720" y="181" fill="#80ed99" font-family="sans-serif" font-size="13">✓ non-owning 3/3</text>
<text x="720" y="212" fill="#80ed99" font-family="sans-serif" font-size="13">✓ Torch mutation visible 3/3</text>
<text x="720" y="243" fill="#80ed99" font-family="sans-serif" font-size="13">✓ micro write visible 3/3</text>
<text x="720" y="274" fill="#80ed99" font-family="sans-serif" font-size="13">✓ owner retained/released 3/3</text>
<text x="720" y="305" fill="#80ed99" font-family="sans-serif" font-size="13">✓ wrapper destroy safe 3/3</text>
<text x="720" y="336" fill="#80ed99" font-family="sans-serif" font-size="13">✓ bad stride rejected 3/3</text>
<text x="720" y="367" fill="#80ed99" font-family="sans-serif" font-size="13">✓ short storage rejected 3/3</text>
<text x="720" y="398" fill="#80ed99" font-family="sans-serif" font-size="13">✓ output Max 0</text>
<text x="55" y="448" fill="#9eb0cf" font-family="sans-serif" font-size="13">384 add submissions use caller pointers; this is correctness/lifetime evidence, not a timed speedup.</text>
<text x="55" y="474" fill="#9eb0cf" font-family="sans-serif" font-size="13">Non-contiguous descriptors are representable but low-level add rejects them instead of copying.</text>
</svg>
