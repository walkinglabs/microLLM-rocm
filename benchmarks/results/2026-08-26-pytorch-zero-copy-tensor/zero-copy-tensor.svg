<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="500" viewBox="0 0 1120 500">
<rect width="1120" height="500" fill="#0b1020"/>
<text x="40" y="42" fill="#f4f7ff" font-family="sans-serif" font-size="25" font-weight="700">PyTorch ROCm zero-copy Tensor descriptors</text>
<text x="40" y="70" fill="#9eb0cf" font-family="sans-serif" font-size="14">Three 16 MiB tensors per process; pointers and ownership remain external</text>
<text x="55" y="115" fill="#f4f7ff" font-family="sans-serif" font-size="16">Payload exposed per run (MiB)</text>
